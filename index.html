<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>땅따먹기 v5.8</title>
    <style>
        :root {
            --bg: #0f0f1a;
            --panel: #1a1a2e;
            --player1: #4ecca3;
            --player2: #ff6b6b;
            --neutral: #2a2a4a;
            --wall: #8888aa;
            --accent: #e94560;
            --button: #ffd700;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system, 'Segoe UI', Roboto, sans-serif; display:flex; justify-content:center; align-items:center; touch-action:none; }
        #game-container { display:flex; flex-direction:column; align-items:center; width:100%; height:100%; max-width:800px; padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); gap:8px; }
        #hud { display:flex; justify-content:space-between; align-items:center; width:100%; background:var(--panel); border-radius:16px; padding:10px 16px; }
        .hud-side { display:flex; align-items:center; gap:10px; }
        .hud-name { font-weight:700; font-size:16px; }
        .hud-score { font-size:24px; font-weight:900; min-width:50px; text-align:center; }
        #version-badge { font-size:12px; color:#aaa; background:#222; padding:2px 10px; border-radius:10px; }
        #turn-info { font-size:14px; font-weight:600; color:#ddd; }
        #board-wrapper { flex:1; width:100%; position:relative; display:flex; align-items:center; justify-content:center; }
        canvas { border-radius:16px; background:#1a1a2e; box-shadow:0 8px 30px rgba(0,0,0,0.8); width:100%; height:100%; object-fit:contain; touch-action:none; }
        #overlay { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); border-radius:16px; z-index:10; opacity:0; pointer-events:none; transition:0.3s; }
        #overlay.active { opacity:1; pointer-events:auto; }
        #overlay-title { font-size:2.5rem; font-weight:900; margin-bottom:8px; }
        #overlay-desc { color:#ccc; margin-bottom:16px; text-align:center; padding:0 20px; }
        #btn-restart { padding:14px 40px; font-size:20px; font-weight:700; border:none; border-radius:50px; background:var(--accent); color:#fff; cursor:pointer; }
        #btn-restart:active { transform:scale(0.95); }
        #controls { display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; padding:8px 0; background:var(--panel); border-radius:16px; }
        #gauge-wrapper { display:flex; align-items:center; gap:10px; width:100%; padding:0 16px; }
        #gauge-bar-bg { flex:1; height:18px; background:#333; border-radius:10px; overflow:hidden; }
        #gauge-bar { height:100%; width:0%; background:linear-gradient(90deg, #55ff55, #ffaa00, #ff5555); border-radius:10px; transition: width 0.05s linear; }
        #gauge-value { font-size:20px; font-weight:900; color:#fff; min-width:45px; text-align:center; }
        #btn-fire { padding:14px 60px; font-size:24px; font-weight:900; border:none; border-radius:50px; background:var(--button); color:#000; cursor:pointer; letter-spacing:2px; box-shadow:0 6px 20px rgba(255,215,0,0.4); }
        #btn-fire:active { transform:scale(0.95); }
        #btn-fire:disabled { background:#555; color:#999; box-shadow:none; }
        #instructions { color:#888; font-size:12px; text-align:center; }
        @media (max-width:500px) { .hud-score { font-size:20px; } #overlay-title { font-size:2rem; } #btn-fire { padding:12px 40px; font-size:20px; } }
    </style>
</head>
<body>
<div id="game-container">
    <div id="hud">
        <div class="hud-side">
            <span style="color:var(--player1); font-size:20px;">🟢</span>
            <div>
                <div class="hud-name" style="color:var(--player1);">나</div>
                <div class="hud-score" id="p1-score" style="color:var(--player1);">0%</div>
            </div>
        </div>
        <div style="text-align:center;">
            <div id="turn-info"></div>
            <div id="version-badge">v5.8</div>
        </div>
        <div class="hud-side">
            <div style="text-align:right;">
                <div class="hud-name" style="color:var(--player2);">컴퓨터</div>
                <div class="hud-score" id="p2-score" style="color:var(--player2);">0%</div>
            </div>
            <span style="color:var(--player2); font-size:20px;">🔴</span>
        </div>
    </div>
    <div id="board-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="overlay">
            <div id="overlay-title"></div>
            <div id="overlay-desc"></div>
            <button id="btn-restart">🔄 다시 시작</button>
        </div>
    </div>
    <div id="controls">
        <div id="gauge-wrapper">
            <span style="color:#fff; font-weight:700;">힘</span>
            <div id="gauge-bar-bg"><div id="gauge-bar"></div></div>
            <span id="gauge-value">5.0</span>
        </div>
        <button id="btn-fire">🚀 발사</button>
    </div>
    <div id="instructions">👆 기지 내부 터치 → 드래그로 방향 설정 → 게이지가 움직이면 발사 버튼</div>
</div>
<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const btnRestart = document.getElementById('btn-restart');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const turnInfoEl = document.getElementById('turn-info');
    const gaugeBar = document.getElementById('gauge-bar');
    const gaugeValue = document.getElementById('gauge-value');
    const btnFire = document.getElementById('btn-fire');

    // 게임 설정
    const BOARD_W = 1400;
    const BOARD_H = 900;
    const BALL_RADIUS = 14;
    const BASE_RADIUS = 90;
    const WALL_THICKNESS = 8;
    const FRICTION = 0.985;
    const MAX_SPEED = 22;
    const MIN_SPEED = 0.3;
    const MAX_SHOTS_PER_TURN = 3;
    const WIN_THRESHOLD = 0.01;
    const POWER_MAX = 10;

    const P1 = 1, P2 = 2;
    const NEUTRAL = 0;

    let territoryMap = null;
    let wallMap = null;      // 영구 벽 (성공한 턴의 벽)
    let tempWallMap = null;  // 현재 턴의 누적 임시 벽 (모든 발사 경로)

    let currentPlayer = P1;
    let shotsLeft = MAX_SHOTS_PER_TURN;
    let hasLeftBase = false;
    let gameOver = false;
    let turnInProgress = false;
    let placingStone = false;
    let failed = false;

    let ball = { x: BOARD_W/2, y: 150, vx: 0, vy: 0, moving: false };

    let isAiming = false;
    let aimStartX = 0, aimStartY = 0;
    let aimCurrentX = 0, aimCurrentY = 0;
    let aimAngle = 0;

    let gaugeAnimId = null;
    let gaugeDirection = 1;
    let gaugeValueCurrent = 5;

    let canvasW = 0, canvasH = 0;
    let dpr = 1;
    let scaleX = 1, scaleY = 1;
    let animId = null;

    function initTerritory() {
        territoryMap = new Uint8Array(BOARD_W * BOARD_H);
        wallMap = new Uint8Array(BOARD_W * BOARD_H);
        tempWallMap = new Uint8Array(BOARD_W * BOARD_H);
        fillCircleToMap(territoryMap, BOARD_W/2, 150, BASE_RADIUS, P1);
        fillCircleToMap(territoryMap, BOARD_W/2, BOARD_H-150, BASE_RADIUS, P2);
    }

    function fillCircleToMap(map, cx, cy, radius, owner) {
        const r2 = radius * radius;
        for (let y = Math.floor(cy-radius); y <= Math.ceil(cy+radius); y++) {
            for (let x = Math.floor(cx-radius); x <= Math.ceil(cx+radius); x++) {
                if (x<0 || x>=BOARD_W || y<0 || y>=BOARD_H) continue;
                const dx = x-cx, dy = y-cy;
                if (dx*dx + dy*dy <= r2) {
                    map[y*BOARD_W + x] = owner;
                }
            }
        }
    }

    function resetBall() {
        ball.moving = false;
        ball.vx = 0; ball.vy = 0;
        const baseX = BOARD_W/2;
        const baseY = currentPlayer === P1 ? 150 : BOARD_H-150;
        ball.x = baseX;
        ball.y = baseY;
        shotsLeft = MAX_SHOTS_PER_TURN;
        hasLeftBase = false;
        turnInProgress = true;
        placingStone = (currentPlayer === P1);
        failed = false;
        tempWallMap = new Uint8Array(BOARD_W * BOARD_H); // 턴 시작 시 초기화
        isAiming = false;
        gaugeValueCurrent = 5;
        updateHUD();
        updateGaugeUI();
        btnFire.disabled = true;
    }

    function initGame() {
        initTerritory();
        currentPlayer = P1;
        gameOver = false;
        resetBall();
        updateHUD();
        overlay.classList.remove('active');
        if (animId) cancelAnimationFrame(animId);
        if (gaugeAnimId) cancelAnimationFrame(gaugeAnimId);
        draw();
    }

    function updateHUD() {
        let p1Count = 0, p2Count = 0;
        for (let i = 0; i < territoryMap.length; i++) {
            if (territoryMap[i] === P1) p1Count++;
            else if (territoryMap[i] === P2) p2Count++;
        }
        const total = BOARD_W * BOARD_H;
        p1ScoreEl.textContent = Math.round(p1Count/total*100) + '%';
        p2ScoreEl.textContent = Math.round(p2Count/total*100) + '%';
        const playerName = currentPlayer === P1 ? '🟢 나' : '🔴 컴퓨터';
        let status = '';
        if (placingStone) status = ' 돌 배치 중: 기지 내부 터치';
        else if (failed) status = ' 실패!';
        else if (isAiming) status = ' 방향 설정 중';
        else status = ` 남은 발사: ${shotsLeft}`;
        turnInfoEl.textContent = playerName + status;
    }

    function updateGaugeUI() {
        gaugeBar.style.width = (gaugeValueCurrent / POWER_MAX * 100) + '%';
        gaugeValue.textContent = gaugeValueCurrent.toFixed(1);
    }

    function startGaugeAnimation() {
        if (gaugeAnimId) cancelAnimationFrame(gaugeAnimId);
        function animateGauge() {
            if (!isAiming || gameOver || !turnInProgress || ball.moving) {
                gaugeAnimId = null;
                return;
            }
            gaugeValueCurrent += gaugeDirection * 0.15;
            if (gaugeValueCurrent >= POWER_MAX) {
                gaugeValueCurrent = POWER_MAX;
                gaugeDirection = -1;
            } else if (gaugeValueCurrent <= 0) {
                gaugeValueCurrent = 0;
                gaugeDirection = 1;
            }
            updateGaugeUI();
            gaugeAnimId = requestAnimationFrame(animateGauge);
        }
        gaugeAnimId = requestAnimationFrame(animateGauge);
    }

    function stopGaugeAnimation() {
        if (gaugeAnimId) {
            cancelAnimationFrame(gaugeAnimId);
            gaugeAnimId = null;
        }
    }

    function resizeCanvas() {
        const wrapper = document.getElementById('board-wrapper');
        const rect = wrapper.getBoundingClientRect();
        dpr = window.devicePixelRatio || 1;
        const maxW = rect.width - 8;
        const maxH = rect.height - 8;
        if (maxW <= 0 || maxH <= 0) {
            requestAnimationFrame(resizeCanvas);
            return;
        }
        canvasW = Math.floor(maxW);
        canvasH = Math.floor(maxH);
        canvas.style.width = canvasW + 'px';
        canvas.style.height = canvasH + 'px';
        canvas.width = canvasW * dpr;
        canvas.height = canvasH * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        scaleX = BOARD_W / canvasW;
        scaleY = BOARD_H / canvasH;
        draw();
    }

    function draw() {
        if (!territoryMap) return;
        ctx.clearRect(0, 0, canvasW, canvasH);

        const offscreen = document.createElement('canvas');
        offscreen.width = BOARD_W;
        offscreen.height = BOARD_H;
        const offCtx = offscreen.getContext('2d');

        const imgData = offCtx.createImageData(BOARD_W, BOARD_H);
        for (let i = 0; i < territoryMap.length; i++) {
            const val = territoryMap[i];
            if (val === P1) {
                imgData.data[i*4] = 78;
                imgData.data[i*4+1] = 204;
                imgData.data[i*4+2] = 163;
                imgData.data[i*4+3] = 255;
            } else if (val === P2) {
                imgData.data[i*4] = 255;
                imgData.data[i*4+1] = 107;
                imgData.data[i*4+2] = 107;
                imgData.data[i*4+3] = 255;
            } else {
                imgData.data[i*4] = 42;
                imgData.data[i*4+1] = 42;
                imgData.data[i*4+2] = 74;
                imgData.data[i*4+3] = 255;
            }
        }
        offCtx.putImageData(imgData, 0, 0);

        // 영구 벽
        for (let i = 0; i < wallMap.length; i++) {
            if (wallMap[i] === 1) {
                const x = i % BOARD_W;
                const y = Math.floor(i / BOARD_W);
                offCtx.fillStyle = '#8888aa';
                offCtx.fillRect(x, y, 1, 1);
            }
        }
        // 임시 벽 (이번 턴 누적)
        for (let i = 0; i < tempWallMap.length; i++) {
            if (tempWallMap[i] === 1) {
                const x = i % BOARD_W;
                const y = Math.floor(i / BOARD_W);
                offCtx.fillStyle = '#aaaacc';
                offCtx.fillRect(x, y, 1, 1);
            }
        }

        drawBase(offCtx, BOARD_W/2, 150, BASE_RADIUS, '나', P1);
        drawBase(offCtx, BOARD_W/2, BOARD_H-150, BASE_RADIUS, '컴', P2);

        offCtx.shadowColor = 'rgba(255,255,255,0.7)';
        offCtx.shadowBlur = 16;
        offCtx.beginPath();
        offCtx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI*2);
        offCtx.fillStyle = currentPlayer === P1 ? '#4ecca3' : '#ff6b6b';
        offCtx.fill();
        offCtx.shadowBlur = 0;
        offCtx.strokeStyle = '#fff';
        offCtx.lineWidth = 3;
        offCtx.stroke();
        offCtx.beginPath();
        offCtx.arc(ball.x - BALL_RADIUS*0.3, ball.y - BALL_RADIUS*0.3, BALL_RADIUS*0.3, 0, Math.PI*2);
        offCtx.fillStyle = 'rgba(255,255,255,0.6)';
        offCtx.fill();

        if (isAiming && !ball.moving && !gameOver && turnInProgress && !placingStone) {
            const dx = aimStartX - aimCurrentX;
            const dy = aimStartY - aimCurrentY;
            const len = Math.sqrt(dx*dx + dy*dy);
            if (len > 10) {
                aimAngle = Math.atan2(dy, dx);
                const guideLen = 80;
                offCtx.strokeStyle = 'rgba(255,255,255,0.7)';
                offCtx.lineWidth = 4;
                offCtx.setLineDash([8, 8]);
                offCtx.beginPath();
                offCtx.moveTo(ball.x, ball.y);
                offCtx.lineTo(ball.x + Math.cos(aimAngle)*guideLen, ball.y + Math.sin(aimAngle)*guideLen);
                offCtx.stroke();
                offCtx.setLineDash([]);
            }
        }

        if (placingStone && !ball.moving && !gameOver) {
            offCtx.strokeStyle = 'rgba(255,255,255,0.8)';
            offCtx.lineWidth = 4;
            offCtx.setLineDash([10, 10]);
            offCtx.beginPath();
            offCtx.arc(BOARD_W/2, currentPlayer === P1 ? 150 : BOARD_H-150, BASE_RADIUS, 0, Math.PI*2);
            offCtx.stroke();
            offCtx.setLineDash([]);
        }

        ctx.drawImage(offscreen, 0, 0, BOARD_W, BOARD_H, 0, 0, canvasW, canvasH);
    }

    function drawBase(ctx, x, y, radius, label, owner) {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${radius*0.7}px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x, y);
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI*2);
        ctx.stroke();
    }

    function launchBall() {
        if (ball.moving || gameOver || !turnInProgress || shotsLeft <= 0 || placingStone || failed || !isAiming) return;
        const power = gaugeValueCurrent / POWER_MAX;
        const speed = power * MAX_SPEED;
        ball.vx = Math.cos(aimAngle) * speed;
        ball.vy = Math.sin(aimAngle) * speed;
        ball.moving = true;
        shotsLeft--;
        isAiming = false;
        stopGaugeAnimation();
        btnFire.disabled = true;
        updateHUD();
        moveBall();
    }

    function moveBall() {
        if (!ball.moving) return;
        ball.vx *= FRICTION;
        ball.vy *= FRICTION;
        const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
        if (speed < MIN_SPEED) {
            ball.moving = false;
            ball.vx = 0; ball.vy = 0;
            checkEndOfShot();
            return;
        }

        const prevX = ball.x, prevY = ball.y;
        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.x < BALL_RADIUS + WALL_THICKNESS) {
            ball.x = BALL_RADIUS + WALL_THICKNESS;
            ball.vx = Math.abs(ball.vx) * 0.9;
        } else if (ball.x > BOARD_W - BALL_RADIUS - WALL_THICKNESS) {
            ball.x = BOARD_W - BALL_RADIUS - WALL_THICKNESS;
            ball.vx = -Math.abs(ball.vx) * 0.9;
        }
        if (ball.y < BALL_RADIUS + WALL_THICKNESS) {
            ball.y = BALL_RADIUS + WALL_THICKNESS;
            ball.vy = Math.abs(ball.vy) * 0.9;
        } else if (ball.y > BOARD_H - BALL_RADIUS - WALL_THICKNESS) {
            ball.y = BOARD_H - BALL_RADIUS - WALL_THICKNESS;
            ball.vy = -Math.abs(ball.vy) * 0.9;
        }

        // 실패 검사 (자신의 영역 + 임시 벽/영구 벽 교차)
        if (checkFailure(prevX, prevY, ball.x, ball.y)) {
            ball.moving = false;
            ball.vx = 0; ball.vy = 0;
            if (animId) cancelAnimationFrame(animId);
            handleFailure();
            return;
        }

        paintTrailToTemp(prevX, prevY, ball.x, ball.y);

        animId = requestAnimationFrame(moveBall);
        draw();
    }

    function isInsideCurrentBase(x, y) {
        const baseX = BOARD_W/2;
        const baseY = currentPlayer === P1 ? 150 : BOARD_H-150;
        const dx = x - baseX, dy = y - baseY;
        return (dx*dx + dy*dy) <= BASE_RADIUS * BASE_RADIUS;
    }

    // 실패 조건: 이동 경로상에 (1) 자신의 영역, (2) 이전에 그린 벽(영구+임시)이 있으면 실패
    // 단, 기지 내부는 안전
    function checkFailure(x1, y1, x2, y2) {
        const steps = Math.ceil(Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1)) / 2);
        for (let i = 1; i < steps; i++) { // 시작점 제외
            const t = i / steps;
            const px = Math.floor(x1 + (x2-x1)*t);
            const py = Math.floor(y1 + (y2-y1)*t);
            if (isInsideCurrentBase(px, py)) continue; // 기지 내부는 통과

            const idx = py * BOARD_W + px;
            // 자신의 영역 (이미 획득한 땅) 확인
            if (territoryMap[idx] === currentPlayer) {
                return true;
            }
            // 벽 확인 (영구 벽 + 이번 턴 누적 임시 벽)
            if (wallMap[idx] === 1 || tempWallMap[idx] === 1) {
                return true;
            }
        }
        return false;
    }

    function paintTrailToTemp(x1, y1, x2, y2) {
        const steps = Math.ceil(Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1)) / 2);
        for (let i = 1; i < steps; i++) {
            const t = i / steps;
            const px = Math.floor(x1 + (x2-x1)*t);
            const py = Math.floor(y1 + (y2-y1)*t);
            if (isInsideCurrentBase(px, py)) continue; // 기지 내부에는 벽 없음
            for (let dy = -BALL_RADIUS+3; dy <= BALL_RADIUS-3; dy++) {
                for (let dx = -BALL_RADIUS+3; dx <= BALL_RADIUS-3; dx++) {
                    const nx = px + dx;
                    const ny = py + dy;
                    if (nx < WALL_THICKNESS || nx >= BOARD_W-WALL_THICKNESS || ny < WALL_THICKNESS || ny >= BOARD_H-WALL_THICKNESS) continue;
                    if (dx*dx + dy*dy <= (BALL_RADIUS-3)*(BALL_RADIUS-3)) {
                        tempWallMap[ny*BOARD_W + nx] = 1;
                    }
                }
            }
        }
    }

    function handleFailure() {
        failed = true;
        turnInProgress = false;
        if (animId) cancelAnimationFrame(animId);
        tempWallMap = new Uint8Array(BOARD_W * BOARD_H);
        isAiming = false;
        stopGaugeAnimation();
        btnFire.disabled = true;
        updateHUD();
        draw();
        setTimeout(() => {
            if (!gameOver) endTurn(false);
        }, 500);
    }

    function checkEndOfShot() {
        const baseX = BOARD_W/2;
        const baseY = currentPlayer === P1 ? 150 : BOARD_H-150;
        const distToBase = Math.sqrt((ball.x-baseX)*(ball.x-baseX) + (ball.y-baseY)*(ball.y-baseY));

        if (hasLeftBase && distToBase <= BASE_RADIUS) {
            acquireTerritory();
            endTurn(true);
        } else if (shotsLeft <= 0) {
            endTurn(false);
        } else {
            if (!hasLeftBase && distToBase > BASE_RADIUS) {
                hasLeftBase = true;
            }
            turnInProgress = true;
            if (currentPlayer === P1) {
                isAiming = false;
                btnFire.disabled = false;
                updateHUD();
                draw();
            } else {
                setTimeout(computerTurn, 800);
            }
        }
    }

    function acquireTerritory() {
        for (let i = 0; i < wallMap.length; i++) {
            if (tempWallMap[i] === 1) wallMap[i] = 1;
        }
        const visited = new Uint8Array(BOARD_W * BOARD_H);
        const queue = [];
        const startX = Math.floor(BOARD_W/2);
        const startY = currentPlayer === P1 ? 150 : BOARD_H-150;
        const startIdx = startY * BOARD_W + startX;
        visited[startIdx] = 1;
        queue.push(startIdx);

        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        while (queue.length > 0) {
            const idx = queue.shift();
            const x = idx % BOARD_W;
            const y = Math.floor(idx / BOARD_W);
            for (const [dx, dy] of dirs) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx < 0 || nx >= BOARD_W || ny < 0 || ny >= BOARD_H) continue;
                const nIdx = ny * BOARD_W + nx;
                if (visited[nIdx]) continue;
                if (wallMap[nIdx] === 1) continue;
                if (territoryMap[nIdx] !== NEUTRAL && territoryMap[nIdx] !== currentPlayer) continue;
                visited[nIdx] = 1;
                queue.push(nIdx);
            }
        }

        for (let i = 0; i < territoryMap.length; i++) {
            if (!visited[i]) {
                territoryMap[i] = currentPlayer;
            }
        }
        tempWallMap = new Uint8Array(BOARD_W * BOARD_H);
    }

    function endTurn(success) {
        turnInProgress = false;
        ball.moving = false;
        ball.vx = 0; ball.vy = 0;
        if (animId) cancelAnimationFrame(animId);
        if (!success) {
            tempWallMap = new Uint8Array(BOARD_W * BOARD_H);
        }
        isAiming = false;
        stopGaugeAnimation();
        btnFire.disabled = true;
        updateHUD();

        let p1Count = 0, p2Count = 0;
        for (let i = 0; i < territoryMap.length; i++) {
            if (territoryMap[i] === P1) p1Count++;
            else if (territoryMap[i] === P2) p2Count++;
        }
        const total = BOARD_W * BOARD_H;
        if (p1Count/total < WIN_THRESHOLD) {
            gameOver = true;
            showGameOver(false, '내 영역이 1% 미만!');
            return;
        } else if (p2Count/total < WIN_THRESHOLD) {
            gameOver = true;
            showGameOver(true, '컴퓨터 영역이 1% 미만!');
            return;
        }

        currentPlayer = currentPlayer === P1 ? P2 : P1;
        resetBall();
        draw();

        if (currentPlayer === P2 && !gameOver) {
            setTimeout(computerTurn, 1000);
        }
    }

    function computerTurn() {
        if (gameOver || currentPlayer !== P2 || !turnInProgress) return;
        const baseX = BOARD_W/2;
        const baseY = BOARD_H-150;
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (BASE_RADIUS - BALL_RADIUS);
        ball.x = baseX + Math.cos(angle) * dist;
        ball.y = baseY + Math.sin(angle) * dist;
        placingStone = false;
        draw();

        setTimeout(() => {
            if (gameOver || currentPlayer !== P2) return;
            const shotAngle = Math.random() * Math.PI * 2;
            const power = 0.4 + Math.random() * 0.6;
            const dx = Math.cos(shotAngle) * power * 80;
            const dy = Math.sin(shotAngle) * power * 80;
            launchBallForComputer(dx, dy);
        }, 500);
    }

    function launchBallForComputer(dx, dy) {
        if (ball.moving || gameOver || !turnInProgress || shotsLeft <= 0 || placingStone || failed) return;
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len < 10) return;
        const power = Math.min(len / 80, 1);
        const speed = power * MAX_SPEED;
        const angle = Math.atan2(dy, dx);
        ball.vx = Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
        ball.moving = true;
        shotsLeft--;
        updateHUD();
        moveBall();
    }

    function showGameOver(playerWon, reason) {
        overlayTitle.textContent = playerWon ? '🎉 승리!' : '😞 패배';
        overlayDesc.textContent = reason;
        overlay.classList.add('active');
        draw();
    }

    function getBoardCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function handleTouchStart(e) {
        e.preventDefault();
        if (gameOver || ball.moving || !turnInProgress) return;
        const touch = e.touches[0];
        const { x, y } = getBoardCoords(touch.clientX, touch.clientY);

        if (placingStone && currentPlayer === P1) {
            const baseX = BOARD_W/2;
            const baseY = 150;
            const dist = Math.sqrt((x-baseX)*(x-baseX) + (y-baseY)*(y-baseY));
            if (dist <= BASE_RADIUS - BALL_RADIUS) {
                ball.x = x;
                ball.y = y;
                placingStone = false;
                updateHUD();
                draw();
                btnFire.disabled = false;
            }
            return;
        }

        if (currentPlayer === P1 && turnInProgress && !placingStone && !ball.moving && !failed) {
            const distToBall = Math.sqrt((x-ball.x)*(x-ball.x) + (y-ball.y)*(y-ball.y));
            if (distToBall < BALL_RADIUS * 3) {
                isAiming = true;
                aimStartX = x;
                aimStartY = y;
                aimCurrentX = x;
                aimCurrentY = y;
                btnFire.disabled = false;
                startGaugeAnimation();
                updateHUD();
                draw();
            }
        }
    }

    function handleTouchMove(e) {
        e.preventDefault();
        if (!isAiming) return;
        const touch = e.touches[0];
        const { x, y } = getBoardCoords(touch.clientX, touch.clientY);
        aimCurrentX = x;
        aimCurrentY = y;
        draw();
    }

    function handleTouchEnd(e) {
        e.preventDefault();
        // 발사는 버튼으로만
    }

    function handleMouseDown(e) {
        if (gameOver || ball.moving || !turnInProgress) return;
        const { x, y } = getBoardCoords(e.clientX, e.clientY);
        if (placingStone && currentPlayer === P1) {
            const baseX = BOARD_W/2;
            const baseY = 150;
            const dist = Math.sqrt((x-baseX)*(x-baseX) + (y-baseY)*(y-baseY));
            if (dist <= BASE_RADIUS - BALL_RADIUS) {
                ball.x = x;
                ball.y = y;
                placingStone = false;
                updateHUD();
                draw();
                btnFire.disabled = false;
            }
            return;
        }
        if (currentPlayer === P1 && turnInProgress && !placingStone && !ball.moving && !failed) {
            const distToBall = Math.sqrt((x-ball.x)*(x-ball.x) + (y-ball.y)*(y-ball.y));
            if (distToBall < BALL_RADIUS * 3) {
                isAiming = true;
                aimStartX = x;
                aimStartY = y;
                aimCurrentX = x;
                aimCurrentY = y;
                btnFire.disabled = false;
                startGaugeAnimation();
                updateHUD();
                draw();
            }
        }
    }

    function handleMouseMove(e) {
        if (!isAiming) return;
        const { x, y } = getBoardCoords(e.clientX, e.clientY);
        aimCurrentX = x;
        aimCurrentY = y;
        draw();
    }

    function handleMouseUp(e) {
        // 발사는 버튼으로만
    }

    canvas.addEventListener('touchstart', handleTouchStart, {passive:false});
    canvas.addEventListener('touchmove', handleTouchMove, {passive:false});
    canvas.addEventListener('touchend', handleTouchEnd, {passive:false});
    canvas.addEventListener('touchcancel', handleTouchEnd, {passive:false});

    canvas.addEventListener('mousedown', handleMouseDown);
    canvas.addEventListener('mousemove', handleMouseMove);
    canvas.addEventListener('mouseup', handleMouseUp);

    btnFire.addEventListener('click', () => {
        if (currentPlayer === P1 && isAiming && !ball.moving && turnInProgress && !placingStone && !failed) {
            launchBall();
        }
    });
    btnFire.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (currentPlayer === P1 && isAiming && !ball.moving && turnInProgress && !placingStone && !failed) {
            launchBall();
        }
    });

    btnRestart.addEventListener('click', () => { initGame(); });
    btnRestart.addEventListener('touchend', (e) => { e.preventDefault(); initGame(); });

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));

    resizeCanvas();
    initGame();
    console.log('🏆 땅따먹기 v5.8 - 정확한 실패 조건');
})();
</script>
