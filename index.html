<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>땅따먹기 v8.1</title>
    <style>
        :root {
            --bg: #0f0f1a;
            --panel: #1a1a2e;
            --player1: #4ecca3;
            --player2: #ff6b6b;
            --neutral: #2a2a4a;
            --wall: #8888aa;
            --accent: #e94560;
            --button: #ffd700;
            --confirm: #4ecca3;
            --cancel: #ff6b6b;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system, 'Segoe UI', Roboto, sans-serif; display:flex; justify-content:center; align-items:center; touch-action:none; }
        #game-container { display:flex; flex-direction:column; align-items:center; width:100%; height:100%; max-width:900px; padding:max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); gap:6px; }
        #hud { display:flex; justify-content:space-between; align-items:center; width:100%; background:var(--panel); border-radius:10px; padding:8px 12px; }
        .hud-side { display:flex; align-items:center; gap:8px; }
        .hud-name { font-weight:700; font-size:14px; }
        .hud-score { font-size:18px; font-weight:900; min-width:40px; text-align:center; }
        #version-badge { font-size:10px; color:#aaa; background:#222; padding:2px 8px; border-radius:8px; }
        #turn-info { font-size:13px; font-weight:600; color:#ddd; }
        #board-wrapper { flex:1; width:100%; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; }
        canvas { border-radius:10px; background:#1a1a2e; box-shadow:0 4px 16px rgba(0,0,0,0.8); width:100%; height:100%; object-fit:contain; touch-action:none; }
        #overlay { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); border-radius:10px; z-index:10; opacity:0; pointer-events:none; transition:0.3s; }
        #overlay.active { opacity:1; pointer-events:auto; }
        #overlay-title { font-size:2rem; font-weight:900; margin-bottom:4px; }
        #overlay-desc { color:#ccc; margin-bottom:10px; text-align:center; padding:0 12px; font-size:14px; }
        #btn-restart { padding:10px 28px; font-size:16px; font-weight:700; border:none; border-radius:30px; background:var(--accent); color:#fff; cursor:pointer; }
        #btn-restart:active { transform:scale(0.95); }
        #controls { display:flex; align-items:center; gap:6px; width:100%; padding:6px 10px; background:var(--panel); border-radius:10px; flex-wrap:wrap; }
        #gauge-wrapper { display:flex; align-items:center; gap:4px; flex:1; min-width:120px; }
        #gauge-bar-bg { flex:1; height:14px; background:#333; border-radius:7px; overflow:hidden; }
        #gauge-bar { height:100%; width:0%; background:linear-gradient(90deg, #55ff55, #ffaa00, #ff5555); border-radius:7px; }
        #gauge-value { font-size:15px; font-weight:900; color:#fff; min-width:38px; text-align:center; }
        .btn { padding:8px 18px; font-size:16px; font-weight:900; border:none; border-radius:20px; cursor:pointer; }
        .btn:active { transform:scale(0.95); }
        .btn:disabled { background:#555; color:#999; }
        #btn-confirm { background:var(--confirm); color:#fff; }
        #btn-cancel { background:var(--cancel); color:#fff; }
        #btn-fire { background:var(--button); color:#000; padding:8px 24px; font-size:18px; }
        #instructions { color:#777; font-size:10px; text-align:center; }
        #success-toast { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(78,204,163,0.9); color:#fff; padding:16px 32px; border-radius:16px; font-size:24px; font-weight:900; z-index:20; pointer-events:none; opacity:0; transition:opacity 0.3s; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="hud">
        <div class="hud-side">
            <span style="color:var(--player1); font-size:16px;">🟢</span>
            <div>
                <div class="hud-name" style="color:var(--player1);">P1</div>
                <div class="hud-score" id="p1-score" style="color:var(--player1);">0%</div>
            </div>
        </div>
        <div style="text-align:center;">
            <div id="turn-info"></div>
            <div id="version-badge">v8.1</div>
        </div>
        <div class="hud-side">
            <div style="text-align:right;">
                <div class="hud-name" style="color:var(--player2);">P2</div>
                <div class="hud-score" id="p2-score" style="color:var(--player2);">0%</div>
            </div>
            <span style="color:var(--player2); font-size:16px;">🔴</span>
        </div>
    </div>
    <div id="board-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="success-toast">🎉 영역 획득!</div>
        <div id="overlay">
            <div id="overlay-title"></div>
            <div id="overlay-desc"></div>
            <button id="btn-restart">🔄 다시 시작</button>
        </div>
    </div>
    <div id="controls">
        <div id="gauge-wrapper">
            <span style="color:#fff; font-weight:700; font-size:12px;">힘</span>
            <div id="gauge-bar-bg"><div id="gauge-bar"></div></div>
            <span id="gauge-value">5.0</span>
        </div>
        <button class="btn" id="btn-confirm">✅ 위치 완료</button>
        <button class="btn" id="btn-cancel">🔄 재설정</button>
        <button class="btn" id="btn-fire">🚀 발사</button>
    </div>
    <div id="instructions">👆 내 영역 터치 → 위치 완료 → 공 근처 드래그 → 발사</div>
</div>
<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const btnRestart = document.getElementById('btn-restart');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const turnInfoEl = document.getElementById('turn-info');
    const gaugeBar = document.getElementById('gauge-bar');
    const gaugeValue = document.getElementById('gauge-value');
    const btnFire = document.getElementById('btn-fire');
    const btnConfirm = document.getElementById('btn-confirm');
    const btnCancel = document.getElementById('btn-cancel');
    const successToast = document.getElementById('success-toast');

    // 게임 설정
    const BOARD_W = 800;
    const BOARD_H = 500;
    const BASE_SIZE = 80;
    const BALL_RADIUS = 6;
    const WALL_THICKNESS = 3;
    const FRICTION = 0.985;
    const MAX_SPEED = 14;
    const MIN_SPEED = 0.3;
    const MAX_SHOTS_PER_TURN = 3;
    const BASE_LOSS_RATIO = 0.5;
    const POWER_MAX = 10;
    const SAFE_DIST_FROM_START = BALL_RADIUS * 3;

    const P1 = 1, P2 = 2;
    const NEUTRAL = 0;

    const BASE1_X = BOARD_W/2, BASE1_Y = 70;
    const BASE2_X = BOARD_W/2, BASE2_Y = BOARD_H - 70;
    const TOTAL_AREA = BOARD_W * BOARD_H;

    let territoryMap = null;
    let wallMap = null;
    let tempWallMap = null;
    let pathPoints = [];

    let currentPlayer = P1;
    let shotsLeft = MAX_SHOTS_PER_TURN;
    let shotsFired = 0;
    let hasLeftBase = false;
    let gameOver = false;
    let turnInProgress = false;
    let placingMode = true;      // true: 공 배치 모드, false: 발사 모드
    let positionConfirmed = false;  // 위치 확정 여부
    let failed = false;

    let ball = { x: BASE1_X, y: BASE1_Y, vx: 0, vy: 0, moving: false };

    let isAiming = false;
    let aimStartX = 0, aimStartY = 0;
    let aimCurrentX = 0, aimCurrentY = 0;
    let aimAngle = 0;

    let gaugeAnimId = null;
    let gaugeDirection = 1;
    let gaugeValueCurrent = 5;

    let canvasW = 0, canvasH = 0;
    let dpr = 1;
    let scaleX = 1, scaleY = 1;
    let animId = null;

    function initTerritory() {
        territoryMap = new Uint8Array(BOARD_W * BOARD_H);
        wallMap = new Uint8Array(BOARD_W * BOARD_H);
        tempWallMap = new Uint8Array(BOARD_W * BOARD_H);
        pathPoints = [];
        fillRectToMap(territoryMap, BASE1_X - BASE_SIZE/2, BASE1_Y - BASE_SIZE/2, BASE_SIZE, BASE_SIZE, P1);
        fillRectToMap(territoryMap, BASE2_X - BASE_SIZE/2, BASE2_Y - BASE_SIZE/2, BASE_SIZE, BASE_SIZE, P2);
    }

    function fillRectToMap(map, x, y, w, h, owner) {
        for (let r = Math.floor(y); r < Math.ceil(y+h); r++) {
            for (let c = Math.floor(x); c < Math.ceil(x+w); c++) {
                if (c >= 0 && c < BOARD_W && r >= 0 && r < BOARD_H) {
                    map[r * BOARD_W + c] = owner;
                }
            }
        }
    }

    function resetBall() {
        ball.moving = false;
        ball.vx = 0; ball.vy = 0;
        if (currentPlayer === P1) {
            ball.x = BASE1_X;
            ball.y = BASE1_Y;
        } else {
            ball.x = BASE2_X;
            ball.y = BASE2_Y;
        }
        shotsLeft = MAX_SHOTS_PER_TURN;
        shotsFired = 0;
        hasLeftBase = false;
        turnInProgress = true;
        placingMode = true;
        positionConfirmed = false;
        failed = false;
        tempWallMap = new Uint8Array(BOARD_W * BOARD_H);
        pathPoints = [];
        isAiming = false;
        gaugeValueCurrent = 5;
        updateHUD();
        updateGaugeUI();
        updateButtons();
    }

    function initGame() {
        initTerritory();
        currentPlayer = P1;
        gameOver = false;
        resetBall();
        updateHUD();
        overlay.classList.remove('active');
        if (animId) cancelAnimationFrame(animId);
        if (gaugeAnimId) cancelAnimationFrame(gaugeAnimId);
        draw();
    }

    function updateButtons() {
        if (placingMode) {
            btnConfirm.disabled = false;
            btnCancel.disabled = true;
            btnFire.disabled = true;
        } else if (isAiming) {
            btnConfirm.disabled = true;
            btnCancel.disabled = true;
            btnFire.disabled = false;
        } else {
            btnConfirm.disabled = true;
            btnCancel.disabled = false;
            btnFire.disabled = false;
        }
    }

    function updateHUD() {
        let p1Count = 0, p2Count = 0;
        for (let i = 0; i < territoryMap.length; i++) {
            if (territoryMap[i] === P1) p1Count++;
            else if (territoryMap[i] === P2) p2Count++;
        }
        p1ScoreEl.textContent = Math.round(p1Count / TOTAL_AREA * 100) + '%';
        p2ScoreEl.textContent = Math.round(p2Count / TOTAL_AREA * 100) + '%';
        const playerName = currentPlayer === P1 ? '🟢 P1' : '🔴 P2';
        let status = '';
        if (placingMode) status = ' 공 배치: 내 영역 터치';
        else if (failed) status = ' 실패!';
        else if (isAiming) status = ' 방향 설정 중';
        else status = ` 남은 발사: ${shotsLeft}`;
        turnInfoEl.textContent = playerName + ' ' + status;
    }

    function updateGaugeUI() {
        gaugeBar.style.width = (gaugeValueCurrent / POWER_MAX * 100) + '%';
        gaugeValue.textContent = gaugeValueCurrent.toFixed(1);
    }

    function startGaugeAnimation() {
        if (gaugeAnimId) cancelAnimationFrame(gaugeAnimId);
        function animateGauge() {
            if (!isAiming || gameOver || !turnInProgress || ball.moving) {
                gaugeAnimId = null;
                return;
            }
            gaugeValueCurrent += gaugeDirection * 0.15;
            if (gaugeValueCurrent >= POWER_MAX) {
                gaugeValueCurrent = POWER_MAX;
                gaugeDirection = -1;
            } else if (gaugeValueCurrent <= 0) {
                gaugeValueCurrent = 0;
                gaugeDirection = 1;
            }
            updateGaugeUI();
            gaugeAnimId = requestAnimationFrame(animateGauge);
        }
        gaugeAnimId = requestAnimationFrame(animateGauge);
    }

    function stopGaugeAnimation() {
        if (gaugeAnimId) {
            cancelAnimationFrame(gaugeAnimId);
            gaugeAnimId = null;
        }
    }

    function resizeCanvas() {
        const wrapper = document.getElementById('board-wrapper');
        const rect = wrapper.getBoundingClientRect();
        dpr = window.devicePixelRatio || 1;
        const maxW = rect.width - 4;
        const maxH = rect.height - 4;
        if (maxW <= 0 || maxH <= 0) {
            requestAnimationFrame(resizeCanvas);
            return;
        }
        canvasW = Math.floor(maxW);
        canvasH = Math.floor(maxH);
        canvas.style.width = canvasW + 'px';
        canvas.style.height = canvasH + 'px';
        canvas.width = canvasW * dpr;
        canvas.height = canvasH * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        scaleX = BOARD_W / canvasW;
        scaleY = BOARD_H / canvasH;
        draw();
    }

    function draw() {
        if (!territoryMap) return;
        ctx.clearRect(0, 0, canvasW, canvasH);
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvasW, canvasH);

        const cellW = canvasW / BOARD_W;
        const cellH = canvasH / BOARD_H;

        for (let r = 0; r < BOARD_H; r++) {
            for (let c = 0; c < BOARD_W; c++) {
                const idx = r * BOARD_W + c;
                if (territoryMap[idx] === P1) {
                    ctx.fillStyle = '#4ecca3';
                    ctx.fillRect(c * cellW, r * cellH, cellW + 0.5, cellH + 0.5);
                } else if (territoryMap[idx] === P2) {
                    ctx.fillStyle = '#ff6b6b';
                    ctx.fillRect(c * cellW, r * cellH, cellW + 0.5, cellH + 0.5);
                }
            }
        }

        for (let i = 0; i < wallMap.length; i++) {
            if (wallMap[i] === 1 || tempWallMap[i] === 1) {
                const x = i % BOARD_W;
                const y = Math.floor(i / BOARD_W);
                ctx.fillStyle = '#aaaacc';
                ctx.fillRect(x * cellW, y * cellH, cellW + 0.5, cellH + 0.5);
            }
        }

        const scaleFactor = Math.min(cellW, cellH);
        const base1ScreenX = BASE1_X * cellW;
        const base1ScreenY = BASE1_Y * cellH;
        const base1ScreenSize = BASE_SIZE * scaleFactor;
        const base2ScreenX = BASE2_X * cellW;
        const base2ScreenY = BASE2_Y * cellH;
        const base2ScreenSize = BASE_SIZE * scaleFactor;

        ctx.fillStyle = 'rgba(78, 204, 163, 0.8)';
        ctx.fillRect(base1ScreenX - base1ScreenSize/2, base1ScreenY - base1ScreenSize/2, base1ScreenSize, base1ScreenSize);
        ctx.strokeStyle = '#4ecca3';
        ctx.lineWidth = 3;
        ctx.strokeRect(base1ScreenX - base1ScreenSize/2, base1ScreenY - base1ScreenSize/2, base1ScreenSize, base1ScreenSize);

        ctx.fillStyle = 'rgba(255, 107, 107, 0.8)';
        ctx.fillRect(base2ScreenX - base2ScreenSize/2, base2ScreenY - base2ScreenSize/2, base2ScreenSize, base2ScreenSize);
        ctx.strokeStyle = '#ff6b6b';
        ctx.lineWidth = 3;
        ctx.strokeRect(base2ScreenX - base2ScreenSize/2, base2ScreenY - base2ScreenSize/2, base2ScreenSize, base2ScreenSize);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('P1', base1ScreenX, base1ScreenY);
        ctx.fillText('P2', base2ScreenX, base2ScreenY);

        const ballScreenX = ball.x * cellW;
        const ballScreenY = ball.y * cellH;
        const ballScreenR = BALL_RADIUS * scaleFactor;
        ctx.shadowColor = 'rgba(255,255,255,0.9)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(ballScreenX, ballScreenY, ballScreenR, 0, Math.PI*2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 조준선 (발사 모드에서만)
        if (isAiming && !placingMode && !ball.moving && !gameOver) {
            const dx = aimStartX - aimCurrentX;
            const dy = aimStartY - aimCurrentY;
            const len = Math.sqrt(dx*dx + dy*dy);
            if (len > 10) {
                aimAngle = Math.atan2(dy, dx);
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(ballScreenX, ballScreenY);
                ctx.lineTo(ballScreenX + Math.cos(aimAngle)*40*scaleFactor, ballScreenY + Math.sin(aimAngle)*40*scaleFactor);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        // 배치 모드 표시
        if (placingMode && !ball.moving && !gameOver) {
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(ballScreenX, ballScreenY, BALL_RADIUS * 4 * scaleFactor, 0, Math.PI*2);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    function confirmPosition() {
        if (!placingMode || ball.moving || gameOver || !turnInProgress) return;
        placingMode = false;
        positionConfirmed = true;
        isAiming = false;
        updateHUD();
        updateButtons();
        draw();
    }

    function cancelPosition() {
        if (placingMode || ball.moving || gameOver || !turnInProgress) return;
        placingMode = true;
        positionConfirmed = false;
        isAiming = false;
        stopGaugeAnimation();
        updateHUD();
        updateButtons();
        draw();
    }

    function launchBall() {
        if (ball.moving || gameOver || !turnInProgress || shotsLeft <= 0 || placingMode || failed || !isAiming) return;
        const power = gaugeValueCurrent / POWER_MAX;
        const speed = power * MAX_SPEED;
        ball.vx = Math.cos(aimAngle) * speed;
        ball.vy = Math.sin(aimAngle) * speed;
        ball.moving = true;
        shotsLeft--;
        shotsFired++;
        isAiming = false;
        stopGaugeAnimation();
        updateButtons();
        updateHUD();
        moveBall();
    }

    function moveBall() {
        if (!ball.moving) return;
        ball.vx *= FRICTION;
        ball.vy *= FRICTION;
        const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
        if (speed < MIN_SPEED) {
            ball.moving = false;
            ball.vx = 0; ball.vy = 0;
            pathPoints.push({x: ball.x, y: ball.y});
            checkEndOfShot();
            return;
        }

        const prevX = ball.x, prevY = ball.y;
        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.x < BALL_RADIUS + WALL_THICKNESS) {
            ball.x = BALL_RADIUS + WALL_THICKNESS;
            ball.vx = Math.abs(ball.vx) * 0.9;
        } else if (ball.x > BOARD_W - BALL_RADIUS - WALL_THICKNESS) {
            ball.x = BOARD_W - BALL_RADIUS - WALL_THICKNESS;
            ball.vx = -Math.abs(ball.vx) * 0.9;
        }
        if (ball.y < BALL_RADIUS + WALL_THICKNESS) {
            ball.y = BALL_RADIUS + WALL_THICKNESS;
            ball.vy = Math.abs(ball.vy) * 0.9;
        } else if (ball.y > BOARD_H - BALL_RADIUS - WALL_THICKNESS) {
            ball.y = BOARD_H - BALL_RADIUS - WALL_THICKNESS;
            ball.vy = -Math.abs(ball.vy) * 0.9;
        }

        if (shotsFired > 1) {
            if (checkFailure(prevX, prevY, ball.x, ball.y)) {
                ball.moving = false;
                ball.vx = 0; ball.vy = 0;
                if (animId) cancelAnimationFrame(animId);
                handleFailure();
                return;
            }
        }

        paintTrailToTemp(prevX, prevY, ball.x, ball.y);
        animId = requestAnimationFrame(moveBall);
        draw();
    }

    function isInsideMyTerritory(x, y) {
        const px = Math.floor(x);
        const py = Math.floor(y);
        if (px < 0 || px >= BOARD_W || py < 0 || py >= BOARD_H) return false;
        return territoryMap[py * BOARD_W + px] === currentPlayer;
    }

    function checkFailure(x1, y1, x2, y2) {
        const safeDistSq = SAFE_DIST_FROM_START * SAFE_DIST_FROM_START;
        const steps = Math.ceil(Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1)) / 2);
        for (let i = 1; i < steps; i++) {
            const t = i / steps;
            const px = Math.floor(x1 + (x2-x1)*t);
            const py = Math.floor(y1 + (y2-y1)*t);
            if (isInsideMyTerritory(px, py)) continue;
            const dx0 = px - x1, dy0 = py - y1;
            if (dx0*dx0 + dy0*dy0 < safeDistSq) continue;
            const idx = py * BOARD_W + px;
            if (territoryMap[idx] === currentPlayer) return true;
            if (wallMap[idx] === 1 || tempWallMap[idx] === 1) return true;
        }
        return false;
    }

    function paintTrailToTemp(x1, y1, x2, y2) {
        const steps = Math.ceil(Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1)) / 2);
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const px = Math.floor(x1 + (x2-x1)*t);
            const py = Math.floor(y1 + (y2-y1)*t);
            if (isInsideMyTerritory(px, py)) continue;
            for (let dy = -BALL_RADIUS+2; dy <= BALL_RADIUS-2; dy++) {
                for (let dx = -BALL_RADIUS+2; dx <= BALL_RADIUS-2; dx++) {
                    const nx = px + dx;
                    const ny = py + dy;
                    if (nx < WALL_THICKNESS || nx >= BOARD_W-WALL_THICKNESS || ny < WALL_THICKNESS || ny >= BOARD_H-WALL_THICKNESS) continue;
                    if (dx*dx + dy*dy <= (BALL_RADIUS-2)*(BALL_RADIUS-2)) {
                        tempWallMap[ny*BOARD_W + nx] = 1;
                    }
                }
            }
        }
    }

    function handleFailure() {
        failed = true;
        turnInProgress = false;
        if (animId) cancelAnimationFrame(animId);
        tempWallMap = new Uint8Array(BOARD_W * BOARD_H);
        pathPoints = [];
        isAiming = false;
        stopGaugeAnimation();
        updateButtons();
        updateHUD();
        draw();
        setTimeout(() => {
            if (!gameOver) endTurn(false);
        }, 500);
    }

    function checkEndOfShot() {
        if (hasLeftBase && isInsideMyTerritory(ball.x, ball.y)) {
            acquireTerritory();
            showSuccessToast();
            endTurn(true);
        } else if (shotsLeft <= 0) {
            endTurn(false);
        } else {
            if (!hasLeftBase && !isInsideMyTerritory(ball.x, ball.y)) {
                hasLeftBase = true;
            }
            turnInProgress = true;
            isAiming = false;
            updateButtons();
            updateHUD();
            draw();
        }
    }

    function showSuccessToast() {
        successToast.style.opacity = '1';
        setTimeout(() => {
            successToast.style.opacity = '0';
        }, 1500);
    }

    function acquireTerritory() {
        for (let i = 0; i < wallMap.length; i++) {
            if (tempWallMap[i] === 1) wallMap[i] = 1;
        }
        if (pathPoints.length >= 3) {
            const polygon = pathPoints.map(p => ({x: p.x, y: p.y}));
            fillPolygon(polygon, currentPlayer);
        }
        tempWallMap = new Uint8Array(BOARD_W * BOARD_H);
        pathPoints = [];
    }

    function fillPolygon(polygon, owner) {
        const minX = Math.max(0, Math.floor(Math.min(...polygon.map(p => p.x))));
        const maxX = Math.min(BOARD_W - 1, Math.ceil(Math.max(...polygon.map(p => p.x))));
        const minY = Math.max(0, Math.floor(Math.min(...polygon.map(p => p.y))));
        const maxY = Math.min(BOARD_H - 1, Math.ceil(Math.max(...polygon.map(p => p.y))));

        for (let y = minY; y <= maxY; y++) {
            for (let x = minX; x <= maxX; x++) {
                if (isPointInPolygon(x, y, polygon)) {
                    territoryMap[y * BOARD_W + x] = owner;
                }
            }
        }
    }

    function isPointInPolygon(x, y, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
            const xi = polygon[i].x, yi = polygon[i].y;
            const xj = polygon[j].x, yj = polygon[j].y;
            const intersect = ((yi > y) !== (yj > y)) &&
                (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    function endTurn(success) {
        turnInProgress = false;
        ball.moving = false;
        ball.vx = 0; ball.vy = 0;
        if (animId) cancelAnimationFrame(animId);
        if (!success) {
            tempWallMap = new Uint8Array(BOARD_W * BOARD_H);
        }
        pathPoints = [];
        isAiming = false;
        stopGaugeAnimation();
        updateButtons();
        updateHUD();

        let p1BaseLost = 0, p2BaseLost = 0;
        const baseArea = BASE_SIZE * BASE_SIZE;

        for (let y = Math.floor(BASE1_Y - BASE_SIZE/2); y <= Math.ceil(BASE1_Y + BASE_SIZE/2); y++) {
            for (let x = Math.floor(BASE1_X - BASE_SIZE/2); x <= Math.ceil(BASE1_X + BASE_SIZE/2); x++) {
                if (x<0 || x>=BOARD_W || y<0 || y>=BOARD_H) continue;
                if (territoryMap[y*BOARD_W + x] !== P1) p1BaseLost++;
            }
        }
        for (let y = Math.floor(BASE2_Y - BASE_SIZE/2); y <= Math.ceil(BASE2_Y + BASE_SIZE/2); y++) {
            for (let x = Math.floor(BASE2_X - BASE_SIZE/2); x <= Math.ceil(BASE2_X + BASE_SIZE/2); x++) {
                if (x<0 || x>=BOARD_W || y<0 || y>=BOARD_H) continue;
                if (territoryMap[y*BOARD_W + x] !== P2) p2BaseLost++;
            }
        }

        if (p1BaseLost / baseArea > BASE_LOSS_RATIO) {
            gameOver = true;
            showGameOver(false, 'P1 기지 50% 이상 빼앗김!');
            return;
        } else if (p2BaseLost / baseArea > BASE_LOSS_RATIO) {
            gameOver = true;
            showGameOver(true, 'P2 기지 50% 이상 빼앗음!');
            return;
        }

        currentPlayer = currentPlayer === P1 ? P2 : P1;
        resetBall();
        draw();
    }

    function showGameOver(playerWon, reason) {
        overlayTitle.textContent = playerWon ? '🎉 P1 승리!' : '🎉 P2 승리!';
        overlayDesc.textContent = reason;
        overlay.classList.add('active');
        draw();
    }

    function getBoardCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function handleTouchStart(e) {
        e.preventDefault();
        if (gameOver || ball.moving || !turnInProgress) return;
        const touch = e.touches[0];
        const { x, y } = getBoardCoords(touch.clientX, touch.clientY);

        if (placingMode) {
            if (isInsideMyTerritory(x, y)) {
                ball.x = x;
                ball.y = y;
                draw();
                updateHUD();
            }
            return;
        }

        if (turnInProgress && !failed) {
            const distToBall = Math.sqrt((x-ball.x)*(x-ball.x) + (y-ball.y)*(y-ball.y));
            if (distToBall < BALL_RADIUS * 3) {
                isAiming = true;
                aimStartX = x;
                aimStartY = y;
                aimCurrentX = x;
                aimCurrentY = y;
                updateButtons();
                startGaugeAnimation();
                updateHUD();
                draw();
            }
        }
    }

    function handleTouchMove(e) {
        e.preventDefault();
        if (!isAiming) return;
        const touch = e.touches[0];
        const { x, y } = getBoardCoords(touch.clientX, touch.clientY);
        aimCurrentX = x;
        aimCurrentY = y;
        draw();
    }

    function handleTouchEnd(e) {
        e.preventDefault();
    }

    function handleMouseDown(e) {
        if (gameOver || ball.moving || !turnInProgress) return;
        const { x, y } = getBoardCoords(e.clientX, e.clientY);

        if (placingMode) {
            if (isInsideMyTerritory(x, y)) {
                ball.x = x;
                ball.y = y;
                draw();
                updateHUD();
            }
            return;
        }

        if (turnInProgress && !failed) {
            const distToBall = Math.sqrt((x-ball.x)*(x-ball.x) + (y-ball.y)*(y-ball.y));
            if (distToBall < BALL_RADIUS * 3) {
                isAiming = true;
                aimStartX = x;
                aimStartY = y;
                aimCurrentX = x;
                aimCurrentY = y;
                updateButtons();
                startGaugeAnimation();
                updateHUD();
                draw();
            }
        }
    }

    function handleMouseMove(e) {
        if (!isAiming) return;
        const { x, y } = getBoardCoords(e.clientX, e.clientY);
        aimCurrentX = x;
        aimCurrentY = y;
        draw();
    }

    function handleMouseUp(e) {
        // 발사는 버튼으로만
    }

    canvas.addEventListener('touchstart', handleTouchStart, {passive:false});
    canvas.addEventListener('touchmove', handleTouchMove, {passive:false});
    canvas.addEventListener('touchend', handleTouchEnd, {passive:false});
    canvas.addEventListener('touchcancel', handleTouchEnd, {passive:false});

    canvas.addEventListener('mousedown', handleMouseDown);
    canvas.addEventListener('mousemove', handleMouseMove);
    canvas.addEventListener('mouseup', handleMouseUp);

    btnConfirm.addEventListener('click', confirmPosition);
    btnConfirm.addEventListener('touchend', (e) => { e.preventDefault(); confirmPosition(); });

    btnCancel.addEventListener('click', cancelPosition);
    btnCancel.addEventListener('touchend', (e) => { e.preventDefault(); cancelPosition(); });

    btnFire.addEventListener('click', () => {
        if (isAiming && !ball.moving && turnInProgress && !placingMode && !failed) {
            launchBall();
        }
    });
    btnFire.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (isAiming && !ball.moving && turnInProgress && !placingMode && !failed) {
            launchBall();
        }
    });

    btnRestart.addEventListener('click', () => { initGame(); });
    btnRestart.addEventListener('touchend', (e) => { e.preventDefault(); initGame(); });

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));

    resizeCanvas();
    initGame();
    console.log('🏆 땅따먹기 v8.1 - 위치 지정 완료/취소');
})();
</script>
