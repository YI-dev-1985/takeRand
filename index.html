<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>땅따먹기 v2.1 - 돌 튕기기 대전</title>
    <style>
        :root {
            --bg: #0f0f1a;
            --panel: #1a1a2e;
            --accent: #e94560;
            --gold: #ffd700;
            --player1: #4ecca3;
            --player2: #ff6b6b;
            --base1: #1e6f5c;
            --base2: #8b3a3a;
            --neutral: #2a2a4a;
            --text: #eee;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system, 'Segoe UI', Roboto, sans-serif; display:flex; justify-content:center; align-items:center; touch-action:none; }
        #game-container { display:flex; flex-direction:column; align-items:center; width:100%; height:100%; max-width:650px; padding:max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); gap:10px; }
        #hud { display:flex; justify-content:space-between; align-items:center; width:100%; background:var(--panel); border-radius:16px; padding:10px 16px; box-shadow:0 4px 20px rgba(0,0,0,0.6); }
        .hud-left, .hud-right { display:flex; flex-direction:column; gap:4px; }
        .hud-name { font-weight:700; font-size:16px; }
        .hud-score { font-size:24px; font-weight:900; }
        .hud-center { display:flex; flex-direction:column; align-items:center; gap:2px; }
        #turn-indicator { font-size:14px; font-weight:600; padding:4px 12px; border-radius:20px; background:#333; }
        #version-badge { font-size:11px; color:#aaa; background:#222; padding:2px 8px; border-radius:8px; }
        #board-wrapper { flex:1; width:100%; display:flex; align-items:center; justify-content:center; position:relative; }
        canvas { border-radius:20px; background:var(--panel); box-shadow:0 10px 30px rgba(0,0,0,0.7), 0 0 0 2px rgba(255,255,255,0.05); width:100%; height:100%; object-fit:contain; touch-action:none; }
        #overlay { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); border-radius:20px; z-index:10; opacity:0; pointer-events:none; transition:0.3s; }
        #overlay.active { opacity:1; pointer-events:auto; }
        #overlay-title { font-size:2.5rem; font-weight:900; margin-bottom:8px; }
        #overlay-desc { color:#ccc; margin-bottom:16px; text-align:center; padding:0 20px; }
        #btn-restart { padding:14px 40px; font-size:20px; font-weight:700; border:none; border-radius:50px; background:var(--accent); color:#fff; cursor:pointer; }
        #btn-restart:active { transform:scale(0.95); }
        #instructions { color:#888; font-size:12px; text-align:center; }
        @media (max-width:400px) { #hud { padding:6px 10px; } .hud-score { font-size:20px; } #overlay-title { font-size:2rem; } }
    </style>
</head>
<body>
<div id="game-container">
    <div id="hud">
        <div class="hud-left">
            <div class="hud-name" style="color:var(--player1);">🟢 나</div>
            <div class="hud-score" id="p1-score">0</div>
        </div>
        <div class="hud-center">
            <div id="turn-indicator">내 차례</div>
            <div id="version-badge">v2.1</div>
        </div>
        <div class="hud-right">
            <div class="hud-name" style="color:var(--player2);">🔴 컴퓨터</div>
            <div class="hud-score" id="p2-score">0</div>
        </div>
    </div>
    <div id="board-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="overlay">
            <div id="overlay-title"></div>
            <div id="overlay-desc"></div>
            <button id="btn-restart">🔄 다시 시작</button>
        </div>
    </div>
    <div id="instructions">👆 돌을 튕길 방향으로 스와이프하세요 (3턴 안에 기지 복귀)</div>
</div>
<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const btnRestart = document.getElementById('btn-restart');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const turnIndicator = document.getElementById('turn-indicator');

    const GRID = 7;
    const TURN_LIMIT = 3;
    const PLAYER1 = 1, PLAYER2 = 2;

    let board = [];
    let base1 = {row:0, col:0};
    let base2 = {row:GRID-1, col:GRID-1};
    let stonePos = {row:0, col:0};
    let currentPlayer = PLAYER1;
    let turnsSinceLeave = 0;
    let hasLeftBase = false;
    let gameOver = false;
    let animating = false;

    let cellSize = 0;
    let dpr = 1;
    let canvasW = 0, canvasH = 0;

    function initGame() {
        board = Array.from({length: GRID}, () => Array(GRID).fill(0));
        board[base1.row][base1.col] = PLAYER1;
        board[base2.row][base2.col] = PLAYER2;
        stonePos = {...base1};
        currentPlayer = PLAYER1;
        turnsSinceLeave = 0;
        hasLeftBase = false;
        gameOver = false;
        updateHUD();
        overlay.classList.remove('active');
        draw();
    }

    function updateHUD() {
        let p1Count = 0, p2Count = 0;
        for (let r=0; r<GRID; r++) for (let c=0; c<GRID; c++) {
            if (board[r][c]===PLAYER1) p1Count++;
            else if (board[r][c]===PLAYER2) p2Count++;
        }
        p1ScoreEl.textContent = p1Count;
        p2ScoreEl.textContent = p2Count;
        turnIndicator.textContent = currentPlayer===PLAYER1 ? '🟢 내 차례' : '🔴 컴퓨터 차례';
    }

    function resizeCanvas() {
        const wrapper = document.getElementById('board-wrapper');
        const rect = wrapper.getBoundingClientRect();
        dpr = window.devicePixelRatio || 1;
        const maxSize = Math.min(rect.width-8, rect.height-8);
        if (maxSize <= 0) {
            // 아직 레이아웃 준비 안 됨
            requestAnimationFrame(resizeCanvas);
            return;
        }
        canvasW = canvasH = Math.floor(maxSize);
        canvas.style.width = canvasW+'px';
        canvas.style.height = canvasH+'px';
        canvas.width = canvasW*dpr;
        canvas.height = canvasH*dpr;
        ctx.setTransform(dpr,0,0,dpr,0,0);
        cellSize = canvasW / GRID;
        draw();
    }

    function draw() {
        if (cellSize <= 0 || !board || board.length === 0) return;
        ctx.clearRect(0,0,canvasW,canvasH);
        // 배경
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0,0,canvasW,canvasH);
        // 셀
        for (let r=0; r<GRID; r++) {
            for (let c=0; c<GRID; c++) {
                const x = c*cellSize, y = r*cellSize;
                const pad = cellSize*0.05;
                const size = cellSize - pad*2;
                if (board[r][c]===PLAYER1) ctx.fillStyle = '#4ecca3';
                else if (board[r][c]===PLAYER2) ctx.fillStyle = '#ff6b6b';
                else ctx.fillStyle = '#2a2a4a';
                // 안전한 roundRect: 직접 사각형 + 모서리 둥글게 대신 fillRect 사용
                ctx.fillRect(x+pad, y+pad, size, size);
                // 기지 표시
                if (r===base1.row && c===base1.col) {
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.beginPath();
                    ctx.arc(x+cellSize/2, y+cellSize/2, cellSize*0.28, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${cellSize*0.5}px -apple-system, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('B1', x+cellSize/2, y+cellSize/2);
                }
                if (r===base2.row && c===base2.col) {
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.beginPath();
                    ctx.arc(x+cellSize/2, y+cellSize/2, cellSize*0.28, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${cellSize*0.5}px -apple-system, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('B2', x+cellSize/2, y+cellSize/2);
                }
            }
        }
        // 돌 그리기 (항상 보이도록)
        const sx = stonePos.col*cellSize + cellSize/2;
        const sy = stonePos.row*cellSize + cellSize/2;
        const radius = cellSize*0.35; // 조금 크게
        ctx.shadowColor = 'rgba(255,255,255,0.7)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(sx, sy, radius, 0, Math.PI*2);
        ctx.fillStyle = currentPlayer===PLAYER1 ? '#4ecca3' : '#ff6b6b';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();
        // 돌 위에 작은 하이라이트
        ctx.beginPath();
        ctx.arc(sx - radius*0.25, sy - radius*0.25, radius*0.3, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fill();
    }

    function flickStone(direction) {
        if (animating || gameOver) return;
        if (currentPlayer !== PLAYER1) return;

        let dr=0, dc=0;
        switch(direction) {
            case 'up': dr=-1; break;
            case 'down': dr=1; break;
            case 'left': dc=-1; break;
            case 'right': dc=1; break;
        }

        const newRow = stonePos.row + dr;
        const newCol = stonePos.col + dc;
        if (newRow<0||newRow>=GRID||newCol<0||newCol>=GRID) return;

        animating = true;
        const from = {...stonePos};
        const to = {row:newRow, col:newCol};
        const startTime = performance.now();
        const duration = 200;

        function animateStep(now) {
            const elapsed = now - startTime;
            let t = Math.min(1, elapsed/duration);
            t = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
            stonePos.row = from.row + (to.row-from.row)*t;
            stonePos.col = from.col + (to.col-from.col)*t;
            draw();
            if (t<1) requestAnimationFrame(animateStep);
            else {
                stonePos = {...to};
                animating = false;
                afterMove();
            }
        }
        requestAnimationFrame(animateStep);
    }

    function afterMove() {
        const currentBase = currentPlayer===PLAYER1 ? base1 : base2;
        if (stonePos.row===currentBase.row && stonePos.col===currentBase.col) {
            if (hasLeftBase) {
                turnsSinceLeave = 0;
                hasLeftBase = false;
                switchTurn();
            }
            return;
        }

        if (board[stonePos.row][stonePos.col] === 0) {
            board[stonePos.row][stonePos.col] = currentPlayer;
        }

        if (!hasLeftBase) {
            hasLeftBase = true;
            turnsSinceLeave = 1;
        } else {
            turnsSinceLeave++;
        }

        if (turnsSinceLeave > TURN_LIMIT) {
            endGame(false, `${currentPlayer===PLAYER1?'나':'컴퓨터'} 패배! 3턴 안에 기지 복귀 실패`);
            return;
        }

        switchTurn();
    }

    function switchTurn() {
        currentPlayer = currentPlayer===PLAYER1 ? PLAYER2 : PLAYER1;
        stonePos = {...(currentPlayer===PLAYER1 ? base1 : base2)};
        hasLeftBase = false;
        turnsSinceLeave = 0;
        updateHUD();
        draw();
        if (currentPlayer===PLAYER2 && !gameOver) {
            setTimeout(computerTurn, 800);
        }
    }

    function computerTurn() {
        if (gameOver || currentPlayer!==PLAYER2) return;
        const directions = ['up','down','left','right'];
        const valid = directions.filter(dir => {
            let dr=0, dc=0;
            if(dir==='up') dr=-1; else if(dir==='down') dr=1; else if(dir==='left') dc=-1; else if(dir==='right') dc=1;
            const nr = stonePos.row+dr, nc = stonePos.col+dc;
            return nr>=0&&nr<GRID&&nc>=0&&nc<GRID;
        });
        if (valid.length===0) return;
        const dir = valid[Math.floor(Math.random()*valid.length)];
        const dr = dir==='up'?-1:dir==='down'?1:0;
        const dc = dir==='left'?-1:dir==='right'?1:0;
        const newRow = stonePos.row+dr, newCol = stonePos.col+dc;
        animating = true;
        const from = {...stonePos};
        const to = {row:newRow, col:newCol};
        const startTime = performance.now();
        function animateStep(now) {
            const elapsed = now-startTime;
            let t = Math.min(1, elapsed/200);
            t = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
            stonePos.row = from.row+(to.row-from.row)*t;
            stonePos.col = from.col+(to.col-from.col)*t;
            draw();
            if(t<1) requestAnimationFrame(animateStep);
            else { stonePos={...to}; animating=false; afterMove(); }
        }
        requestAnimationFrame(animateStep);
    }

    function endGame(won, reason) {
        if (gameOver) return;
        gameOver = true;
        overlayTitle.textContent = won ? '🎉 승리!' : '😞 패배';
        overlayDesc.textContent = reason || '';
        overlay.classList.add('active');
    }

    // 입력 처리
    let touchStartX=0, touchStartY=0;
    canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); const t=e.touches[0]; touchStartX=t.clientX; touchStartY=t.clientY; }, {passive:false});
    canvas.addEventListener('touchend', (e)=>{
        e.preventDefault();
        if (!touchStartX) return;
        const t=e.changedTouches[0];
        const dx=t.clientX-touchStartX, dy=t.clientY-touchStartY;
        if (Math.abs(dx)<10 && Math.abs(dy)<10) return;
        if (Math.abs(dx)>Math.abs(dy)) flickStone(dx>0?'right':'left');
        else flickStone(dy>0?'down':'up');
        touchStartX=0; touchStartY=0;
    }, {passive:false});
    canvas.addEventListener('mousedown', (e)=>{ touchStartX=e.clientX; touchStartY=e.clientY; });
    canvas.addEventListener('mouseup', (e)=>{
        const dx=e.clientX-touchStartX, dy=e.clientY-touchStartY;
        if (Math.abs(dx)<10 && Math.abs(dy)<10) return;
        if (Math.abs(dx)>Math.abs(dy)) flickStone(dx>0?'right':'left');
        else flickStone(dy>0?'down':'up');
        touchStartX=0; touchStartY=0;
    });

    btnRestart.addEventListener('click', ()=>{ initGame(); });
    btnRestart.addEventListener('touchend', (e)=>{ e.preventDefault(); initGame(); });

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas, 300));

    resizeCanvas();
    initGame();
    console.log('🏆 땅따먹기 v2.1 - 돌 튕기기 대전 시작!');
})();
</script>
</body>
</html>
