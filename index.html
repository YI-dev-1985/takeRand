<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>추억의 병뚜껑 땅따먹기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'GmarketSansMedium', sans-serif, system-ui;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-amber-100 min-h-screen flex flex-col items-center justify-between p-2 md:p-3">
    <!-- Header Controls -->
    <header class="w-full max-w-6xl bg-amber-800 text-amber-50 rounded-xl p-2.5 shadow-md flex justify-between items-center mb-1.5">
        <div>
            <h1 class="text-lg md:text-xl font-bold flex items-center gap-2">
                <span>⛳ 추억의 땅따먹기</span>
            </h1>
            <p class="text-xs text-amber-200">1~2턴 기지 조기복귀 아웃! 반드시 3번째 턴에 돌아오세요.</p>
        </div>
        <div class="flex items-center gap-2">
            <!-- Mode Switcher -->
            <div class="flex bg-amber-950/60 p-1 rounded-lg text-xs font-semibold items-center gap-1 border border-amber-600/50">
                <button id="modeNormalBtn" class="px-2 py-1 rounded bg-amber-500 text-amber-950 font-bold">기본 맵</button>
                <button id="modeLargeBtn" class="px-2 py-1 rounded hover:bg-amber-700 text-amber-100">대형 맵</button>
            </div>
            <button id="resetBtn" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-1.5 px-3 rounded-lg text-xs md:text-sm transition shadow">
                새 게임
            </button>
        </div>
    </header>

    <!-- Game Status Bar -->
    <div class="w-full max-w-6xl bg-white/90 backdrop-blur rounded-lg p-2 shadow-sm mb-1.5 flex justify-around items-center text-xs md:text-sm border border-amber-200">
        <div id="p1Status" class="flex items-center gap-2 font-bold text-red-600 px-3 py-1 rounded-full border-2 border-red-500 bg-red-50">
            <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
            <span>Player 1 (레드): <span id="p1Score">1.0</span>% (기지 <span id="p1BaseRatio">100</span>%)</span>
        </div>
        
        <div class="text-center px-2">
            <span id="turnIndicator" class="font-extrabold text-amber-900 text-sm md:text-base">Player 1 턴</span>
            <div id="shotsLeft" class="text-xs text-gray-600 font-medium">남은 횟수: 3/3</div>
        </div>

        <div id="p2Status" class="flex items-center gap-2 font-bold text-blue-600 px-3 py-1 rounded-full border-2 border-transparent opacity-60">
            <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
            <span>Player 2 (블루): <span id="p2Score">1.0</span>% (기지 <span id="p2BaseRatio">100</span>%)</span>
        </div>
    </div>

    <!-- Canvas Container -->
    <main class="w-full max-w-6xl flex-1 h-[48vh] md:h-[54vh] flex justify-center items-center relative overflow-hidden rounded-2xl shadow-xl border-4 border-amber-900/40 bg-[#d7c097]">
        <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>

        <!-- Large Mode Only: Movable Minimap -->
        <div id="minimapContainer" class="hidden absolute top-3 right-3 bg-black/80 backdrop-blur rounded-lg p-1.5 border border-amber-500/60 shadow-2xl z-20 flex flex-col items-center select-none">
            <div id="minimapHeader" class="text-[10px] text-amber-200 font-bold mb-1 flex items-center justify-between w-full px-1 cursor-move bg-white/10 rounded py-0.5">
                <span>✋ 🗺️ 미니맵</span>
                <span class="text-[9px] text-gray-300">드래그 이동</span>
            </div>
            <canvas id="minimapCanvas" width="160" height="100" class="border border-amber-700/60 rounded cursor-pointer bg-[#c5ae82]"></canvas>
        </div>
        
        <!-- Large Mode Only: Camera Controls -->
        <div id="cameraControls" class="hidden absolute bottom-3 right-3 flex-col gap-1.5 z-10">
            <button id="toggleMinimapBtn" class="bg-amber-950/80 hover:bg-amber-900 text-amber-200 text-xs py-1.5 px-2.5 rounded-lg backdrop-blur flex items-center justify-center gap-1 font-bold border border-amber-500/50 shadow-lg">
                <span>🗺️ 미니맵:</span> <span id="minimapStatus" class="text-green-400">ON</span>
            </button>
            <div class="flex bg-black/60 backdrop-blur rounded-lg p-1 text-white gap-1 shadow-lg">
                <button id="zoomInBtn" class="w-8 h-8 flex items-center justify-center bg-white/20 hover:bg-white/40 rounded font-bold text-lg" title="확대">+</button>
                <button id="zoomOutBtn" class="w-8 h-8 flex items-center justify-center bg-white/20 hover:bg-white/40 rounded font-bold text-lg" title="축소">-</button>
                <button id="recenterBtn" class="px-2.5 h-8 flex items-center justify-center bg-amber-600 hover:bg-amber-500 rounded font-bold text-xs shadow">🎯 내 위치</button>
            </div>
            <button id="panToggleBtn" class="bg-black/60 hover:bg-black/80 text-white text-xs py-1.5 px-2.5 rounded-lg backdrop-blur flex items-center justify-center gap-1 font-semibold border border-white/20 shadow-lg">
                <span>✋ 시점 이동 모드:</span> <span id="panStatus" class="text-red-400">OFF</span>
            </button>
        </div>

        <!-- Toast Notification Message -->
        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/85 text-white font-bold text-base md:text-xl px-6 py-3 rounded-full pointer-events-none opacity-0 transition-opacity duration-300 shadow-2xl text-center z-30">
            메시지
        </div>

        <!-- Victory Modal Overlay -->
        <div id="victoryModal" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col justify-center items-center z-40 text-white p-4">
            <div class="bg-amber-900 border-4 border-amber-500 rounded-2xl p-6 text-center max-w-md shadow-2xl">
                <h2 id="victoryTitle" class="text-2xl md:text-3xl font-extrabold mb-2 text-amber-300">🎉 승리!</h2>
                <p id="victoryDesc" class="text-sm md:text-base mb-6 text-amber-100">승리 조건이 달성되었습니다!</p>
                <button id="modalResetBtn" class="bg-amber-500 hover:bg-amber-400 text-amber-950 font-bold py-2 px-6 rounded-xl text-base shadow-lg transition">
                    다시 하기
                </button>
            </div>
        </div>
    </main>

    <!-- Dual Control Dashboard -->
    <div class="w-full max-w-6xl bg-amber-900/90 text-white rounded-xl p-3 mt-1.5 shadow-lg flex items-center justify-around gap-4 border border-amber-700">
        
        <!-- Wheel Steering Control -->
        <div class="flex flex-col items-center gap-1">
            <span class="text-[11px] text-amber-200 font-bold">🧭 다이얼 방향 설정</span>
            <div id="steeringWheel" class="w-20 h-20 md:w-24 md:h-24 rounded-full border-4 border-amber-500 bg-amber-950 shadow-2xl flex items-center justify-center cursor-grab active:cursor-grabbing relative touch-none">
                <div class="w-3 h-3 bg-amber-400 rounded-full absolute top-1 shadow-md"></div>
                <div class="w-1.5 h-1.5 bg-white/40 rounded-full"></div>
                <div class="w-full h-[1px] bg-amber-700/50 absolute"></div>
                <div class="h-full w-[1px] bg-amber-700/50 absolute"></div>
            </div>
        </div>

        <!-- Pull-to-Flick Trigger Pad -->
        <div class="flex-1 max-w-md flex flex-col items-center gap-1">
            <span class="text-[11px] text-amber-200 font-bold">🎯 다이얼 조준 후 아래로 당겨 발사</span>
            <div id="flickPad" class="w-full h-20 md:h-24 bg-amber-950/80 rounded-xl border-2 border-dashed border-amber-500 flex flex-col items-center justify-center cursor-pointer touch-none relative overflow-hidden select-none">
                <div id="flickHandle" class="bg-gradient-to-b from-red-500 to-amber-600 text-white font-extrabold px-6 py-2 rounded-full shadow-lg border border-amber-300 text-xs md:text-sm transition-transform duration-75 pointer-events-none flex items-center gap-1">
                    <span>🤏 당겨서 발사!</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Quick Guide Modal / Help -->
    <footer class="w-full max-w-6xl text-center text-xs text-amber-900/70 mt-1">
        💡 <span class="font-semibold">조작법:</span> [방법 1] 병뚜껑을 직접 드래그 | [방법 2] 하단 다이얼 조준 후 패드를 당겨 발사!
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');
        const minimapContainer = document.getElementById('minimapContainer');
        const minimapHeader = document.getElementById('minimapHeader');
        const cameraControls = document.getElementById('cameraControls');
        const toggleMinimapBtn = document.getElementById('toggleMinimapBtn');
        const minimapStatusEl = document.getElementById('minimapStatus');

        const modeNormalBtn = document.getElementById('modeNormalBtn');
        const modeLargeBtn = document.getElementById('modeLargeBtn');

        const p1ScoreEl = document.getElementById('p1Score');
        const p2ScoreEl = document.getElementById('p2Score');
        const p1BaseRatioEl = document.getElementById('p1BaseRatio');
        const p2BaseRatioEl = document.getElementById('p2BaseRatio');
        const turnIndicatorEl = document.getElementById('turnIndicator');
        const shotsLeftEl = document.getElementById('shotsLeft');
        const toastEl = document.getElementById('toast');
        const p1StatusEl = document.getElementById('p1Status');
        const p2StatusEl = document.getElementById('p2Status');
        const victoryModal = document.getElementById('victoryModal');
        const victoryTitle = document.getElementById('victoryTitle');
        const victoryDesc = document.getElementById('victoryDesc');

        const steeringWheel = document.getElementById('steeringWheel');
        const flickPad = document.getElementById('flickPad');
        const flickHandle = document.getElementById('flickHandle');

        const panToggleBtn = document.getElementById('panToggleBtn');
        const panStatusEl = document.getElementById('panStatus');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playFlickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playBounceSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playSuccessSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554, now + 0.1);
            osc.frequency.setValueAtTime(659, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(now + 0.35);
        }

        function playFailSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.25);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(now + 0.25);
        }

        let isLargeMode = false;
        let isMinimapVisible = true;
        let MAP_WIDTH = 1200;
        let MAP_HEIGHT = 800;
        let CAP_RADIUS = 14;
        let FRICTION = 0.965;
        let BOUNCE_RESTITUTION = 0.8;
        let MIN_VELOCITY = 0.15;

        let screenWidth = 0, screenHeight = 0;
        let currentPlayer = 1;
        let currentShot = 0;
        let isMoving = false;
        let gameOver = false;

        let aimAngle = (315 * Math.PI) / 180;
        let wheelRotation = 315;

        let isDraggingCap = false;
        let dragStartPos = { x: 0, y: 0 };
        let dragCurrentPos = { x: 0, y: 0 };

        let isPullingFlick = false;
        let flickPullDistance = 0;
        let maxFlickPull = 80;
        let flickStartY = 0;

        let camera = {
            x: 0,
            y: 0,
            zoom: 1.0,
            minZoom: 0.25,
            maxZoom: 2.2
        };

        let isPanning = false;
        let panModeActive = false;
        let panStart = { x: 0, y: 0 };

        let isDraggingMinimap = false;
        let minimapDragStart = { x: 0, y: 0 };

        let p1Canvas, p1Ctx;
        let p2Canvas, p2Ctx;

        let p1InitialArea = 0;
        let p2InitialArea = 0;
        let baseRadiusCalculated = 0;

        let cap = {
            x: -100,
            y: -100,
            vx: 0,
            vy: 0
        };

        let turnPath = [];

        function setWheelAngle(degrees) {
            wheelRotation = (degrees + 360) % 360;
            aimAngle = (wheelRotation * Math.PI) / 180;
            steeringWheel.style.transform = `rotate(${wheelRotation + 90}deg)`;
        }

        function setGameMode(large) {
            isLargeMode = large;

            if (isLargeMode) {
                MAP_WIDTH = 3200;
                MAP_HEIGHT = 2000;
                FRICTION = 0.968;
                if (isMinimapVisible) minimapContainer.classList.remove('hidden');
                cameraControls.classList.remove('hidden');
                cameraControls.classList.add('flex');

                modeLargeBtn.className = "px-2 py-1 rounded bg-amber-500 text-amber-950 font-bold";
                modeNormalBtn.className = "px-2 py-1 rounded hover:bg-amber-700 text-amber-100";
            } else {
                MAP_WIDTH = screenWidth || 1000;
                MAP_HEIGHT = screenHeight || 650;
                FRICTION = 0.965;
                minimapContainer.classList.add('hidden');
                cameraControls.classList.add('hidden');
                cameraControls.classList.remove('flex');

                modeNormalBtn.className = "px-2 py-1 rounded bg-amber-500 text-amber-950 font-bold";
                modeLargeBtn.className = "px-2 py-1 rounded hover:bg-amber-700 text-amber-100";
            }

            initGame();
        }

        function toggleMinimap() {
            isMinimapVisible = !isMinimapVisible;
            if (isMinimapVisible && isLargeMode) {
                minimapContainer.classList.remove('hidden');
                minimapStatusEl.textContent = 'ON';
                minimapStatusEl.className = 'text-green-400';
            } else {
                minimapContainer.classList.add('hidden');
                minimapStatusEl.textContent = 'OFF';
                minimapStatusEl.className = 'text-red-400';
            }
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            
            screenWidth = Math.floor(rect.width);
            screenHeight = Math.floor(rect.height);

            canvas.width = screenWidth;
            canvas.height = screenHeight;

            if (!isLargeMode) {
                MAP_WIDTH = screenWidth;
                MAP_HEIGHT = screenHeight;
            } else {
                camera.minZoom = Math.max(screenWidth / MAP_WIDTH, screenHeight / MAP_HEIGHT) * 0.8;
                if (camera.zoom < camera.minZoom) camera.zoom = camera.minZoom;
                clampCamera();
            }

            initGame();
        }

        function initGame() {
            gameOver = false;
            victoryModal.classList.add('hidden');

            minimapContainer.style.top = '12px';
            minimapContainer.style.right = '12px';
            minimapContainer.style.left = 'auto';
            minimapContainer.style.bottom = 'auto';

            p1Canvas = document.createElement('canvas');
            p1Canvas.width = MAP_WIDTH;
            p1Canvas.height = MAP_HEIGHT;
            p1Ctx = p1Canvas.getContext('2d');

            p2Canvas = document.createElement('canvas');
            p2Canvas.width = MAP_WIDTH;
            p2Canvas.height = MAP_HEIGHT;
            p2Ctx = p2Canvas.getContext('2d');

            if (isLargeMode) {
                const mapArea = MAP_WIDTH * MAP_HEIGHT;
                baseRadiusCalculated = Math.sqrt((0.04 * mapArea) / Math.PI);
            } else {
                baseRadiusCalculated = Math.min(MAP_WIDTH, MAP_HEIGHT) * 0.22;
            }

            p1Ctx.fillStyle = '#FF0000';
            p1Ctx.beginPath();
            p1Ctx.arc(0, MAP_HEIGHT, baseRadiusCalculated, 0, Math.PI * 2);
            p1Ctx.fill();

            p2Ctx.fillStyle = '#0000FF';
            p2Ctx.beginPath();
            p2Ctx.arc(MAP_WIDTH, 0, baseRadiusCalculated, 0, Math.PI * 2);
            p2Ctx.fill();

            p1InitialArea = calculateAreaPixels(p1Ctx);
            p2InitialArea = calculateAreaPixels(p2Ctx);

            currentPlayer = 1;
            resetTurnState();

            if (isLargeMode) {
                camera.zoom = 0.8;
                recenterCameraOnCurrentPlayer();
            }

            updateScores();
            updateUI();
        }

        function recenterCameraOnCurrentPlayer() {
            if (!isLargeMode) return;

            let focusX, focusY;

            if (currentShot > 0 && cap.x >= 0) {
                focusX = cap.x;
                focusY = cap.y;
            } else {
                if (currentPlayer === 1) {
                    focusX = baseRadiusCalculated * 0.5;
                    focusY = MAP_HEIGHT - (baseRadiusCalculated * 0.5);
                } else {
                    focusX = MAP_WIDTH - (baseRadiusCalculated * 0.5);
                    focusY = baseRadiusCalculated * 0.5;
                }
            }

            camera.x = focusX - (screenWidth / (2 * camera.zoom));
            camera.y = focusY - (screenHeight / (2 * camera.zoom));
            clampCamera();
        }

        function clampCamera() {
            if (!isLargeMode) return;

            const visibleW = screenWidth / camera.zoom;
            const visibleH = screenHeight / camera.zoom;

            const margin = 100;

            if (visibleW >= MAP_WIDTH) {
                camera.x = (MAP_WIDTH - visibleW) / 2;
            } else {
                camera.x = Math.max(-margin, Math.min(MAP_WIDTH - visibleW + margin, camera.x));
            }

            if (visibleH >= MAP_HEIGHT) {
                camera.y = (MAP_HEIGHT - visibleH) / 2;
            } else {
                camera.y = Math.max(-margin, Math.min(MAP_HEIGHT - visibleH + margin, camera.y));
            }
        }

        function resetTurnState() {
            currentShot = 0;
            turnPath = [];
            isMoving = false;
            isDraggingCap = false;
            isPullingFlick = false;
            cap.vx = 0;
            cap.vy = 0;

            const defaultX = currentPlayer === 1 ? baseRadiusCalculated * 0.4 : MAP_WIDTH - (baseRadiusCalculated * 0.4);
            const defaultY = currentPlayer === 1 ? MAP_HEIGHT - (baseRadiusCalculated * 0.4) : baseRadiusCalculated * 0.4;
            cap.x = defaultX;
            cap.y = defaultY;

            flickPullDistance = 0;
            flickHandle.style.transform = `translateY(0px)`;

            if (currentPlayer === 1) {
                setWheelAngle(315);
            } else {
                setWheelAngle(135);
            }
        }

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.style.opacity = '1';
            setTimeout(() => {
                toastEl.style.opacity = '0';
            }, 1800);
        }

        function isPointInTerritory(x, y, player) {
            if (x < 0 || x >= MAP_WIDTH || y < 0 || y >= MAP_HEIGHT) return false;
            const ctxToCheck = player === 1 ? p1Ctx : p2Ctx;
            const pixel = ctxToCheck.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
            return pixel[3] > 128;
        }

        function calculateAreaPixels(targetCtx) {
            const sampleStep = 8;
            let count = 0;
            const data = targetCtx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;

            for (let y = 0; y < MAP_HEIGHT; y += sampleStep) {
                for (let x = 0; x < MAP_WIDTH; x += sampleStep) {
                    const idx = (y * MAP_WIDTH + x) * 4 + 3;
                    if (data[idx] > 128) count++;
                }
            }
            return count;
        }

        function updateScores() {
            const sampleStep = 8;
            let p1Count = 0;
            let p2Count = 0;
            let total = 0;

            const p1Data = p1Ctx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;
            const p2Data = p2Ctx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;

            for (let y = 0; y < MAP_HEIGHT; y += sampleStep) {
                for (let x = 0; x < MAP_WIDTH; x += sampleStep) {
                    const idx = (y * MAP_WIDTH + x) * 4 + 3;
                    total++;
                    if (p1Data[idx] > 128) p1Count++;
                    if (p2Data[idx] > 128) p2Count++;
                }
            }

            const p1PercentFloat = (p1Count / total) * 100;
            const p2PercentFloat = (p2Count / total) * 100;

            const p1Percent = p1PercentFloat.toFixed(1);
            const p2Percent = p2PercentFloat.toFixed(1);

            const p1Ratio = Math.min(100, Math.round((p1Count / p1InitialArea) * 100));
            const p2Ratio = Math.min(100, Math.round((p2Count / p2InitialArea) * 100));

            p1ScoreEl.textContent = p1Percent;
            p2ScoreEl.textContent = p2Percent;
            p1BaseRatioEl.textContent = p1Ratio;
            p2BaseRatioEl.textContent = p2Ratio;

            if (p1PercentFloat >= 90.0) {
                triggerVictory(1, "Player 1이 전체 맵의 90% 이상을 차지했습니다!");
            } else if (p2PercentFloat >= 90.0) {
                triggerVictory(2, "Player 2가 전체 맵의 90% 이상을 차지했습니다!");
            } else if (p2Ratio <= 50) {
                triggerVictory(1, "Player 2(블루)의 기지가 절반 이하로 줄어들었습니다!");
            } else if (p1Ratio <= 50) {
                triggerVictory(2, "Player 1(레드)의 기지가 절반 이하로 줄어들었습니다!");
            }
        }

        function triggerVictory(winner, desc) {
            gameOver = true;
            playSuccessSound();
            victoryTitle.textContent = `🎉 Player ${winner} (${winner === 1 ? '레드' : '블루'}) 승리!`;
            victoryDesc.textContent = desc;
            victoryModal.classList.remove('hidden');
        }

        function switchTurn(message, isSuccess = false) {
            if (gameOver) return;

            if (message) showToast(message);
            if (isSuccess) playSuccessSound(); else playFailSound();

            currentPlayer = currentPlayer === 1 ? 2 : 1;
            resetTurnState();
            if (isLargeMode) recenterCameraOnCurrentPlayer();
            updateUI();
        }

        function updateUI() {
            turnIndicatorEl.textContent = `Player ${currentPlayer} (${currentPlayer === 1 ? '레드' : '블루'}) 턴`;
            turnIndicatorEl.className = `font-extrabold text-sm md:text-base ${currentPlayer === 1 ? 'text-red-600' : 'text-blue-600'}`;
            shotsLeftEl.textContent = `남은 횟수: ${3 - currentShot}/3`;

            if (currentPlayer === 1) {
                p1StatusEl.classList.add('border-red-500', 'bg-red-50', 'opacity-100');
                p1StatusEl.classList.remove('border-transparent', 'opacity-60');
                p2StatusEl.classList.add('border-transparent', 'opacity-60');
                p2StatusEl.classList.remove('border-blue-500', 'bg-blue-50', 'opacity-100');
            } else {
                p2StatusEl.classList.add('border-blue-500', 'bg-blue-50', 'opacity-100');
                p2StatusEl.classList.remove('border-transparent', 'opacity-60');
                p1StatusEl.classList.add('border-transparent', 'opacity-60');
                p1StatusEl.classList.remove('border-red-500', 'bg-red-50', 'opacity-100');
            }
        }

        function captureTerritory() {
            if (turnPath.length < 2) return;

            const targetCtx = currentPlayer === 1 ? p1Ctx : p2Ctx;
            const enemyCtx = currentPlayer === 1 ? p2Ctx : p1Ctx;

            targetCtx.fillStyle = currentPlayer === 1 ? '#FF0000' : '#0000FF';
            targetCtx.beginPath();
            targetCtx.moveTo(turnPath[0].x, turnPath[0].y);

            for (let i = 1; i < turnPath.length; i++) {
                targetCtx.lineTo(turnPath[i].x, turnPath[i].y);
            }
            targetCtx.closePath();
            targetCtx.fill();

            enemyCtx.globalCompositeOperation = 'destination-out';
            enemyCtx.beginPath();
            enemyCtx.moveTo(turnPath[0].x, turnPath[0].y);
            for (let i = 1; i < turnPath.length; i++) {
                enemyCtx.lineTo(turnPath[i].x, turnPath[i].y);
            }
            enemyCtx.closePath();
            enemyCtx.fill();
            enemyCtx.globalCompositeOperation = 'source-over';

            updateScores();
        }

        function screenToMapPos(screenX, screenY) {
            if (!isLargeMode) return { x: screenX, y: screenY };
            return {
                x: camera.x + (screenX / camera.zoom),
                y: camera.y + (screenY / camera.zoom)
            };
        }

        function getScreenPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // Direct Cap Drag (Only sets position on click/touch, does NOT launch immediately)
        function handleBoardClick(e) {
            if (isMoving || gameOver) return;

            if (isLargeMode && (e.button === 2 || panModeActive)) {
                isPanning = true;
                const scr = getScreenPos(e);
                panStart = { x: scr.x, y: scr.y };
                return;
            }

            if (e.button !== 0 && e.type !== 'touchstart') return;

            const scr = getScreenPos(e);
            const mapPos = screenToMapPos(scr.x, scr.y);

            let activeCapX = cap.x;
            let activeCapY = cap.y;
            if (currentShot === 0 && (cap.x < 0 || cap.y < 0)) {
                activeCapX = currentPlayer === 1 ? baseRadiusCalculated * 0.4 : MAP_WIDTH - (baseRadiusCalculated * 0.4);
                activeCapY = currentPlayer === 1 ? MAP_HEIGHT - (baseRadiusCalculated * 0.4) : baseRadiusCalculated * 0.4;
            }

            // Verify if click is within territory
            if (isPointInTerritory(mapPos.x, mapPos.y, currentPlayer)) {
                cap.x = mapPos.x;
                cap.y = mapPos.y;
                turnPath = [{ x: mapPos.x, y: mapPos.y }];
            } else {
                showToast("기지 내부에서 시작 위치를 선택하세요!");
                return;
            }

            isDraggingCap = true;
            dragStartPos = { x: cap.x, y: cap.y };
            dragCurrentPos = mapPos;
        }

        function handleBoardMove(e) {
            const scr = getScreenPos(e);

            if (isLargeMode && isPanning) {
                const dx = (scr.x - panStart.x) / camera.zoom;
                const dy = (scr.y - panStart.y) / camera.zoom;
                camera.x -= dx;
                camera.y -= dy;
                panStart = { x: scr.x, y: scr.y };
                clampCamera();
                return;
            }

            if (!isDraggingCap) return;
            dragCurrentPos = screenToMapPos(scr.x, scr.y);
        }

        function handleBoardRelease() {
            if (isPanning) {
                isPanning = false;
                return;
            }

            if (!isDraggingCap) return;
            isDraggingCap = false;

            const dx = dragStartPos.x - dragCurrentPos.x;
            const dy = dragStartPos.y - dragCurrentPos.y;
            const pullDistance = Math.hypot(dx, dy);

            if (pullDistance < 6) return; // If clicked without dragging, keep position without launching

            const maxPullDistance = 160;
            const maxSpeed = isLargeMode ? 26 : 22;
            const scaleSpeed = Math.min(pullDistance / maxPullDistance, 1.0) * maxSpeed;

            const angle = Math.atan2(dy, dx);
            cap.vx = Math.cos(angle) * scaleSpeed;
            cap.vy = Math.sin(angle) * scaleSpeed;

            isMoving = true;
            currentShot++;
            shotsLeftEl.textContent = `남은 횟수: ${3 - currentShot}/3`;

            playFlickSound();
        }

        // Wheel Steering
        let isWheelTurning = false;

        function handleWheelStart(e) {
            if (isMoving || gameOver) return;
            isWheelTurning = true;
            handleWheelRotate(e);
        }

        function handleWheelRotate(e) {
            if (!isWheelTurning) return;
            const rect = steeringWheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const rad = Math.atan2(clientY - centerY, clientX - centerX);
            let deg = (rad * 180) / Math.PI;
            setWheelAngle(deg);
        }

        function handleWheelEnd() {
            isWheelTurning = false;
        }

        steeringWheel.addEventListener('mousedown', handleWheelStart);
        window.addEventListener('mousemove', handleWheelRotate);
        window.addEventListener('mouseup', handleWheelEnd);
        steeringWheel.addEventListener('touchstart', (e) => { e.preventDefault(); handleWheelStart(e); });
        window.addEventListener('touchmove', handleWheelRotate);
        window.addEventListener('touchend', handleWheelEnd);

        // Pull Pad
        function handleFlickStart(e) {
            if (isMoving || gameOver) return;
            if (currentShot === 0 && (cap.x < 0 || cap.y < 0)) {
                const startX = currentPlayer === 1 ? baseRadiusCalculated * 0.4 : MAP_WIDTH - (baseRadiusCalculated * 0.4);
                const startY = currentPlayer === 1 ? MAP_HEIGHT - (baseRadiusCalculated * 0.4) : baseRadiusCalculated * 0.4;
                cap.x = startX;
                cap.y = startY;
                turnPath = [{ x: startX, y: startY }];
            }
            isPullingFlick = true;
            flickStartY = e.touches ? e.touches[0].clientY : e.clientY;
        }

        function handleFlickMove(e) {
            if (!isPullingFlick) return;
            const currentY = e.touches ? e.touches[0].clientY : e.clientY;
            const dy = currentY - flickStartY;
            flickPullDistance = Math.max(0, Math.min(maxFlickPull, dy));
            flickHandle.style.transform = `translateY(${flickPullDistance}px)`;
        }

        function handleFlickEnd() {
            if (!isPullingFlick) return;
            isPullingFlick = false;
            if (flickPullDistance > 8) {
                launchCapByPull(flickPullDistance);
            }
            flickPullDistance = 0;
            flickHandle.style.transform = `translateY(0px)`;
        }

        flickPad.addEventListener('mousedown', handleFlickStart);
        window.addEventListener('mousemove', handleFlickMove);
        window.addEventListener('mouseup', handleFlickEnd);
        flickPad.addEventListener('touchstart', (e) => { e.preventDefault(); handleFlickStart(e); });
        window.addEventListener('touchmove', handleFlickMove);
        window.addEventListener('touchend', handleFlickEnd);

        function launchCapByPull(pullDist) {
            if (isMoving || gameOver) return;
            const pullRatio = pullDist / maxFlickPull;
            const maxSpeed = isLargeMode ? 26 : 22;
            const actualSpeed = Math.max(3, pullRatio * maxSpeed);

            cap.vx = Math.cos(aimAngle) * actualSpeed;
            cap.vy = Math.sin(aimAngle) * actualSpeed;

            isMoving = true;
            currentShot++;
            shotsLeftEl.textContent = `남은 횟수: ${3 - currentShot}/3`;
            playFlickSound();
        }

        // Global Event Binding
        canvas.addEventListener('mousedown', handleBoardClick);
        window.addEventListener('mousemove', handleBoardMove);
        window.addEventListener('mouseup', handleBoardRelease);

        canvas.addEventListener('touchstart', (e) => {
            if (isLargeMode && e.touches.length === 2) return;
            e.preventDefault();
            handleBoardClick(e);
        }, { passive: false });
        window.addEventListener('touchmove', handleBoardMove, { passive: false });
        window.addEventListener('touchend', handleBoardRelease);

        // Minimap Drag
        minimapHeader.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            isDraggingMinimap = true;
            const rect = minimapContainer.getBoundingClientRect();
            minimapDragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingMinimap) return;
            const mainRect = canvas.parentElement.getBoundingClientRect();
            let newLeft = e.clientX - mainRect.left - minimapDragStart.x;
            let newTop = e.clientY - mainRect.top - minimapDragStart.y;
            newLeft = Math.max(0, Math.min(mainRect.width - minimapContainer.offsetWidth, newLeft));
            newTop = Math.max(0, Math.min(mainRect.height - minimapContainer.offsetHeight, newTop));
            minimapContainer.style.left = newLeft + 'px';
            minimapContainer.style.top = newTop + 'px';
            minimapContainer.style.right = 'auto';
        });

        window.addEventListener('mouseup', () => { isDraggingMinimap = false; });

        minimapHeader.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            isDraggingMinimap = true;
            const rect = minimapContainer.getBoundingClientRect();
            minimapDragStart = { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!isDraggingMinimap || !e.touches[0]) return;
            const mainRect = canvas.parentElement.getBoundingClientRect();
            let newLeft = e.touches[0].clientX - mainRect.left - minimapDragStart.x;
            let newTop = e.touches[0].clientY - mainRect.top - minimapDragStart.y;
            newLeft = Math.max(0, Math.min(mainRect.width - minimapContainer.offsetWidth, newLeft));
            newTop = Math.max(0, Math.min(mainRect.height - minimapContainer.offsetHeight, newTop));
            minimapContainer.style.left = newLeft + 'px';
            minimapContainer.style.top = newTop + 'px';
            minimapContainer.style.right = 'auto';
        }, { passive: false });

        window.addEventListener('touchend', () => { isDraggingMinimap = false; });

        minimapCanvas.addEventListener('click', (e) => {
            if (!isLargeMode) return;
            const rect = minimapCanvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            const mapX = (clickX / minimapCanvas.width) * MAP_WIDTH;
            const mapY = (clickY / minimapCanvas.height) * MAP_HEIGHT;
            camera.x = mapX - (screenWidth / (2 * camera.zoom));
            camera.y = mapY - (screenHeight / (2 * camera.zoom));
            clampCamera();
        });

        let initialPinchDist = null;
        canvas.addEventListener('touchstart', (e) => {
            if (isLargeMode && e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (isLargeMode && e.touches.length === 2 && initialPinchDist) {
                const newDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = newDist / initialPinchDist;
                camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, camera.zoom * (zoomFactor > 1 ? 1.03 : 0.97)));
                clampCamera();
                initialPinchDist = newDist;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => { initialPinchDist = null; });

        canvas.addEventListener('wheel', (e) => {
            if (!isLargeMode) return;
            e.preventDefault();
            const zoomAmount = e.deltaY < 0 ? 1.1 : 0.9;
            const scr = getScreenPos(e);
            const mapBefore = screenToMapPos(scr.x, scr.y);
            camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, camera.zoom * zoomAmount));
            camera.x = mapBefore.x - (scr.x / camera.zoom);
            camera.y = mapBefore.y - (scr.y / camera.zoom);
            clampCamera();
        }, { passive: false });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        toggleMinimapBtn.addEventListener('click', toggleMinimap);
        modeNormalBtn.addEventListener('click', () => setGameMode(false));
        modeLargeBtn.addEventListener('click', () => setGameMode(true));

        document.getElementById('zoomInBtn').addEventListener('click', () => {
            camera.zoom = Math.min(camera.maxZoom, camera.zoom * 1.25);
            clampCamera();
        });
        document.getElementById('zoomOutBtn').addEventListener('click', () => {
            camera.zoom = Math.max(camera.minZoom, camera.zoom / 1.25);
            clampCamera();
        });
        document.getElementById('recenterBtn').addEventListener('click', () => {
            recenterCameraOnCurrentPlayer();
            showToast("내 위치로 이동했습니다.");
        });

        panToggleBtn.addEventListener('click', () => {
            panModeActive = !panModeActive;
            panStatusEl.textContent = panModeActive ? "ON" : "OFF";
            panStatusEl.className = panModeActive ? "text-green-400 font-bold" : "text-red-400";
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            initGame();
            showToast("새 게임 시작!");
        });

        document.getElementById('modalResetBtn').addEventListener('click', () => {
            initGame();
            showToast("새 게임 시작!");
        });

        function updatePhysics() {
            if (gameOver || !isMoving) return;

            cap.x += cap.vx;
            cap.y += cap.vy;

            if (isLargeMode) {
                camera.x = cap.x - (screenWidth / (2 * camera.zoom));
                camera.y = cap.y - (screenHeight / (2 * camera.zoom));
                clampCamera();
            }

            let bounced = false;

            if (cap.x - CAP_RADIUS < 0) {
                cap.x = CAP_RADIUS;
                cap.vx = -cap.vx * BOUNCE_RESTITUTION;
                bounced = true;
            } else if (cap.x + CAP_RADIUS > MAP_WIDTH) {
                cap.x = MAP_WIDTH - CAP_RADIUS;
                cap.vx = -cap.vx * BOUNCE_RESTITUTION;
                bounced = true;
            }

            if (cap.y - CAP_RADIUS < 0) {
                cap.y = CAP_RADIUS;
                cap.vy = -cap.vy * BOUNCE_RESTITUTION;
                bounced = true;
            } else if (cap.y + CAP_RADIUS > MAP_HEIGHT) {
                cap.y = MAP_HEIGHT - CAP_RADIUS;
                cap.vy = -cap.vy * BOUNCE_RESTITUTION;
                bounced = true;
            }

            if (bounced) {
                playBounceSound();
            }

            cap.vx *= FRICTION;
            cap.vy *= FRICTION;

            const lastPt = turnPath[turnPath.length - 1];
            if (Math.hypot(cap.x - lastPt.x, cap.y - lastPt.y) > 5) {
                turnPath.push({ x: cap.x, y: cap.y });
            }

            if (Math.hypot(cap.vx, cap.vy) < MIN_VELOCITY) {
                cap.vx = 0;
                cap.vy = 0;
                isMoving = false;
                isDraggingCap = false;
                isPullingFlick = false;

                const opponentPlayer = currentPlayer === 1 ? 2 : 1;
                const inOpponentTerritory = isPointInTerritory(cap.x, cap.y, opponentPlayer);

                if (inOpponentTerritory) {
                    switchTurn("아웃! 상대방 영토 위에서 멈췄습니다!");
                    return;
                }

                const inOwnTerritory = isPointInTerritory(cap.x, cap.y, currentPlayer);

                if (currentShot < 3) {
                    if (inOwnTerritory) {
                        switchTurn(`실패! ${currentShot}번째 턴에 기지로 돌아왔습니다. (3번째 턴에 돌아와야 함)`);
                    } else {
                        showToast(`다음 위치에서 튕기세요 (${currentShot}/3)`);
                    }
                } else if (currentShot === 3) {
                    if (inOwnTerritory) {
                        captureTerritory();
                        switchTurn("3턴 만에 땅 넓히기 성공!", true);
                    } else {
                        switchTurn("3턴째에 기지로 돌아오지 못했습니다!");
                    }
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, screenWidth, screenHeight);

            ctx.save();
            if (isLargeMode) {
                ctx.scale(camera.zoom, camera.zoom);
                ctx.translate(-camera.x, -camera.y);
            }

            ctx.fillStyle = '#d7c097';
            ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            ctx.strokeStyle = 'rgba(120, 80, 20, 0.12)';
            ctx.lineWidth = 1;
            const gridSize = 45;
            for (let x = 0; x < MAP_WIDTH; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke();
            }
            for (let y = 0; y < MAP_HEIGHT; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke();
            }

            ctx.save();
            ctx.globalAlpha = 0.5;
            ctx.drawImage(p1Canvas, 0, 0);
            ctx.drawImage(p2Canvas, 0, 0);
            ctx.restore();

            ctx.lineWidth = 4;
            ctx.strokeStyle = '#78350F';
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            if (turnPath.length > 0) {
                ctx.beginPath();
                ctx.moveTo(turnPath[0].x, turnPath[0].y);
                for (let i = 1; i < turnPath.length; i++) {
                    ctx.lineTo(turnPath[i].x, turnPath[i].y);
                }
                ctx.strokeStyle = currentPlayer === 1 ? '#EF4444' : '#3B82F6';
                ctx.lineWidth = 4;
                ctx.setLineDash([6, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            let activeCapX = cap.x;
            let activeCapY = cap.y;

            if (currentShot === 0 && (cap.x < 0 || cap.y < 0)) {
                activeCapX = currentPlayer === 1 ? baseRadiusCalculated * 0.4 : MAP_WIDTH - (baseRadiusCalculated * 0.4);
                activeCapY = currentPlayer === 1 ? MAP_HEIGHT - (baseRadiusCalculated * 0.4) : baseRadiusCalculated * 0.4;
            }

            // Direct Drag Arrow
            if (isDraggingCap && !isMoving) {
                const dx = dragStartPos.x - dragCurrentPos.x;
                const dy = dragStartPos.y - dragCurrentPos.y;
                const targetX = dragStartPos.x + dx;
                const targetY = dragStartPos.y + dy;

                ctx.beginPath();
                ctx.moveTo(dragStartPos.x, dragStartPos.y);
                ctx.lineTo(targetX, targetY);
                ctx.strokeStyle = currentPlayer === 1 ? '#DC2626' : '#2563EB';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.stroke();

                const angle = Math.atan2(dy, dx);
                const headLen = 14;
                ctx.beginPath();
                ctx.moveTo(targetX, targetY);
                ctx.lineTo(
                    targetX - headLen * Math.cos(angle - Math.PI / 6),
                    targetY - headLen * Math.sin(angle - Math.PI / 6)
                );
                ctx.lineTo(
                    targetX - headLen * Math.cos(angle + Math.PI / 6),
                    targetY - headLen * Math.sin(angle + Math.PI / 6)
                );
                ctx.closePath();
                ctx.fillStyle = currentPlayer === 1 ? '#DC2626' : '#2563EB';
                ctx.fill();
            } else if (!isMoving) {
                // Wheel Steering Arrow Preview (Length scales dynamically with bottom pull pad distance!)
                const startOffset = CAP_RADIUS + 3;
                const baseArrowLen = 25;
                const dynamicArrowLen = baseArrowLen + (flickPullDistance / maxFlickPull) * 55;

                const startX = activeCapX + Math.cos(aimAngle) * startOffset;
                const startY = activeCapY + Math.sin(aimAngle) * startOffset;
                const targetX = startX + Math.cos(aimAngle) * dynamicArrowLen;
                const targetY = startY + Math.sin(aimAngle) * dynamicArrowLen;

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(targetX, targetY);
                ctx.strokeStyle = currentPlayer === 1 ? '#DC2626' : '#2563EB';
                ctx.lineWidth = 4 + (flickPullDistance / maxFlickPull) * 3;
                ctx.stroke();

                const headLen = 12 + (flickPullDistance / maxFlickPull) * 4;
                ctx.beginPath();
                ctx.moveTo(targetX, targetY);
                ctx.lineTo(
                    targetX - headLen * Math.cos(aimAngle - Math.PI / 6),
                    targetY - headLen * Math.sin(aimAngle - Math.PI / 6)
                );
                ctx.lineTo(
                    targetX - headLen * Math.cos(aimAngle + Math.PI / 6),
                    targetY - headLen * Math.sin(aimAngle + Math.PI / 6)
                );
                ctx.closePath();
                ctx.fillStyle = currentPlayer === 1 ? '#DC2626' : '#2563EB';
                ctx.fill();
            }

            if (activeCapX >= 0 && activeCapY >= 0) {
                ctx.save();
                ctx.translate(activeCapX, activeCapY);

                ctx.beginPath();
                ctx.arc(2, 3, CAP_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, CAP_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = currentPlayer === 1 ? '#EF4444' : '#3B82F6';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, CAP_RADIUS * 0.7, 0, Math.PI * 2);
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            if (currentShot === 0 && !isDraggingCap && !isMoving && !gameOver) {
                const textX = currentPlayer === 1 ? baseRadiusCalculated * 0.5 : MAP_WIDTH - (baseRadiusCalculated * 0.5);
                const textY = currentPlayer === 1 ? MAP_HEIGHT - (baseRadiusCalculated * 0.5) : baseRadiusCalculated * 0.5;

                ctx.fillStyle = currentPlayer === 1 ? 'rgba(239, 68, 68, 0.85)' : 'rgba(59, 130, 246, 0.85)';
                ctx.font = 'bold 15px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("기지 내 원하는 위치를 눌러 튕기세요!", textX, textY + (currentPlayer === 1 ? -40 : 50));
            }

            ctx.restore();

            if (isLargeMode && isMinimapVisible) {
                renderMinimap();
            }
        }

        function renderMinimap() {
            const mW = minimapCanvas.width;
            const mH = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, mW, mH);

            minimapCtx.fillStyle = '#d7c097';
            minimapCtx.fillRect(0, 0, mW, mH);

            minimapCtx.save();
            minimapCtx.globalAlpha = 0.7;
            minimapCtx.drawImage(p1Canvas, 0, 0, mW, mH);
            minimapCtx.drawImage(p2Canvas, 0, 0, mW, mH);
            minimapCtx.restore();

            minimapCtx.strokeStyle = '#78350F';
            minimapCtx.lineWidth = 1.5;
            minimapCtx.strokeRect(0, 0, mW, mH);

            if (cap.x >= 0 && cap.y >= 0) {
                const capMX = (cap.x / MAP_WIDTH) * mW;
                const capMY = (cap.y / MAP_HEIGHT) * mH;

                minimapCtx.beginPath();
                minimapCtx.arc(capMX, capMY, 3.5, 0, Math.PI * 2);
                minimapCtx.fillStyle = currentPlayer === 1 ? '#EF4444' : '#3B82F6';
                minimapCtx.fill();
            }

            const viewX = (camera.x / MAP_WIDTH) * mW;
            const viewY = (camera.y / MAP_HEIGHT) * mH;
            const viewW = ((screenWidth / camera.zoom) / MAP_WIDTH) * mW;
            const viewH = ((screenHeight / camera.zoom) / MAP_HEIGHT) * mH;

            minimapCtx.strokeStyle = '#FFFFFF';
            minimapCtx.lineWidth = 1.8;
            minimapCtx.strokeRect(viewX, viewY, viewW, viewH);
        }

        function gameLoop() {
            updatePhysics();
            render();
            requestAnimationFrame(gameLoop);
        }

        window.onload = function() {
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            gameLoop();
        };
    </script>
</body>
</html>
